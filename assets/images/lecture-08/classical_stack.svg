<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="330" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="28.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">Классическая модельная схема управления гуманоидом (≈ 2010–2022)</text>
<rect x="20.0" y="60.0" width="250.0" height="120.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="145.0" y="86.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">План шагов</text>
<text x="145.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">A* по допустимым</text>
<text x="145.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">местам постановки</text>
<text x="145.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">~1 Гц</text>
<line x1="270.0" y1="120.0" x2="286.0" y2="120.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="290.0" y="60.0" width="250.0" height="120.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="415.0" y="86.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Траектория ЦМ</text>
<text x="415.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">ZMP preview /</text>
<text x="415.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">MPC центроидной</text>
<text x="415.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">динамики, 10–100 Гц</text>
<line x1="540.0" y1="120.0" x2="556.0" y2="120.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="560.0" y="60.0" width="250.0" height="120.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="685.0" y="86.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">Полнотельное упр. (WBC)</text>
<text x="685.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">QP с иерархией задач:</text>
<text x="685.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">моменты всех суставов</text>
<text x="685.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">500–1000 Гц</text>
<line x1="810.0" y1="120.0" x2="826.0" y2="120.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="830.0" y="60.0" width="250.0" height="120.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="955.0" y="86.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Приводы</text>
<text x="955.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">регуляторы тока</text>
<text x="955.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">и момента</text>
<text x="955.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">≈ 10 кГц</text>
<text x="150.0" y="200.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">лекция 02</text>
<text x="415.0" y="200.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">лекция 05</text>
<rect x="20.0" y="220.0" width="1060.0" height="90.0" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="40.0" y="248.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Сильные стороны: предсказуемость, явные ограничения (трение, пределы моментов), объяснимость.</text>
<text x="40.0" y="270.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Слабые: нужна точная модель и ручная настройка десятков весов; трудно с неожиданными контактами,</text>
<text x="40.0" y="292.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">скользкой опорой, падениями. Именно на этих местах обучаемые политики дали главный выигрыш.</text>
</svg>
