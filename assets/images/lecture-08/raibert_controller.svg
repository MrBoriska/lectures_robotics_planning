<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="330" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="28.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Регулятор Raibert (1983–1986): три независимых простых закона вместо полной модели</text>
<rect x="30.0" y="60.0" width="330.0" height="130.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="195.0" y="86.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">1. Высота прыжка</text>
<text x="195.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">толчок ногой в фазе опоры</text>
<text x="195.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">добавляет энергию;</text>
<text x="195.0" y="152.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">регулирует высоту</text>
<rect x="380.0" y="60.0" width="330.0" height="130.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="545.0" y="86.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="700">2. Скорость: куда ставить ногу</text>
<text x="545.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">x<tspan baseline-shift="sub" font-size="72%">f</tspan> = ẋ·T<tspan baseline-shift="sub" font-size="72%">s</tspan>/2 + k(ẋ − ẋ<tspan baseline-shift="sub" font-size="72%">зад</tspan>)</text>
<text x="545.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">нейтральная точка + поправка</text>
<text x="545.0" y="152.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">на ошибку скорости</text>
<rect x="730.0" y="60.0" width="330.0" height="130.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="895.0" y="86.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">3. Наклон корпуса</text>
<text x="895.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">момент в бедре во время</text>
<text x="895.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">опоры выравнивает</text>
<text x="895.0" y="152.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">корпус</text>
<text x="30.0" y="230.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Главная идея: устойчивость не обязана быть статической. Робот всё время «падает», но каждый шаг</text>
<text x="30.0" y="254.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">ставит ногу так, чтобы падение компенсировалось. Это предшественник точки захвата (2006)</text>
<text x="30.0" y="278.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">и путь Boston Dynamics: Raibert основал компанию в 1992 году.</text>
</svg>
