<text x="126.0" y="75.0" font-size="13" fill="#059669" text-anchor="start" font-weight="700">устоит без шага:</text>
<text x="126.0" y="91.0" font-size="13" fill="#059669" text-anchor="start" font-weight="400">точка захвата ξ внутри стопы</text>
<text x="322.0" y="185.0" font-size="13" fill="#059669" text-anchor="start" font-weight="700">Δv = 0.3</text>
<text x="478.8" y="105.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">Δv = 0.6: падение</text>
<text x="670.0" y="70.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Точка захвата (capture point):</text>
<text x="670.0" y="92.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">  ξ = x + ẋ / ω</text>
<text x="670.0" y="114.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="670.0" y="136.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Её движение:  ξ̇ = ω (ξ − p).</text>
<text x="670.0" y="158.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="670.0" y="180.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">p — внутри стопы, поэтому:</text>
<text x="670.0" y="202.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">• ξ в стопе → ZMP «догоняет» ξ,</text>
<text x="670.0" y="224.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">  робот останавливается;</text>
<text x="670.0" y="246.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">• ξ за носком → ξ убегает</text>
<text x="670.0" y="268.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">  экспоненциально: нужен шаг</text>
<text x="670.0" y="290.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">  в точку ξ (или дальше).</text>
</svg>
