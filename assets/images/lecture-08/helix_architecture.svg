<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="380" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="28.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Figure Helix: «медленная» и «быстрая» системы (2025) и полнотельный уровень S0 (Helix 02, 2026)</text>
<rect x="30.0" y="60.0" width="300.0" height="120.0" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="180.0" y="86.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">S2: модель «зрение + язык»</text>
<text x="180.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">7 млрд параметров, 7–9 Гц;</text>
<text x="180.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">понимает сцену и команду;</text>
<text x="180.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">выдаёт вектор-«намерение»</text>
<rect x="400.0" y="60.0" width="300.0" height="120.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="550.0" y="86.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">S1: визуомоторная политика</text>
<text x="550.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">80 млн параметров, 200 Гц;</text>
<text x="550.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">камеры + суставы + намерение</text>
<text x="550.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">→ цели для суставов</text>
<rect x="770.0" y="60.0" width="300.0" height="120.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="920.0" y="86.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">S0: полнотельный регулятор</text>
<text x="920.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">≈ 10 млн параметров, 1 кГц;</text>
<text x="920.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">равновесие и контакты;</text>
<text x="920.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">обучен RL (Helix 02)</text>
<line x1="330.0" y1="120.0" x2="396.0" y2="120.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrP)"/>
<text x="363.0" y="110.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="400">латентный</text>
<text x="363.0" y="140.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="400">вектор</text>
<line x1="700.0" y1="120.0" x2="766.0" y2="120.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrB)"/>
<line x1="920.0" y1="180.0" x2="920.0" y2="226.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrG)"/>
<rect x="770.0" y="230.0" width="300.0" height="70.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="920.0" y="256.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Приводы всего тела</text>
<text x="920.0" y="280.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">ноги, корпус, руки, пальцы</text>
<text x="30.0" y="230.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Helix (февраль 2025): 35 степеней свободы верхней части тела; ≈ 500 часов</text>
<text x="30.0" y="252.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">телеуправляемых демонстраций; S2 и S1 работают на двух бортовых GPU.</text>
<text x="30.0" y="274.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Helix 02 (январь 2026): S1 управляет всем телом, ниже добавлен S0.</text>
<text x="30.0" y="296.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Пример из отчёта: 4 минуты загрузки посудомойки без вмешательства.</text>
<text x="30.0" y="318.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Это данные компании, независимой проверки нет.</text>
<text x="30.0" y="356.0" font-size="13" fill="#475569" text-anchor="start" font-weight="400">Аналог идеи «две системы»: Kahneman, «Думай медленно… решай быстро». Та же схема у NVIDIA GR00T N1 (2025).</text>
</svg>
