<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="330" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="28.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">Полнотельное управление как задача квадратичного программирования</text>
<rect x="30.0" y="52.0" width="640.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="46.0" y="79.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="700">Приоритет 1 (жёстко)</text>
<text x="230.0" y="79.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">динамика; опора не скользит (конус трения); пределы моментов</text>
<rect x="30.0" y="104.0" width="640.0" height="44.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="46.0" y="131.0" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">Приоритет 2</text>
<text x="230.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">равновесие: ускорение ЦМ и момент импульса по плану</text>
<rect x="30.0" y="156.0" width="640.0" height="44.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="46.0" y="183.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700">Приоритет 3</text>
<text x="230.0" y="183.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">движение стопы в переносе, руки к объекту</text>
<rect x="30.0" y="208.0" width="640.0" height="44.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
<text x="46.0" y="235.0" font-size="14" fill="#475569" text-anchor="start" font-weight="700">Приоритет 4</text>
<text x="230.0" y="235.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">поза по умолчанию, плавность</text>
<text x="700.0" y="70.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Переменные: ускорения q̈,</text>
<text x="700.0" y="94.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">силы контакта F, моменты τ.</text>
<text x="700.0" y="118.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="700.0" y="142.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">min Σ wᵢ ‖Jᵢ q̈ + J̇ᵢ q̇ − ẍᵢ*‖²</text>
<text x="700.0" y="166.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">при M q̈ + h = Sᵀτ + J<tspan baseline-shift="sub" font-size="72%">c</tspan>ᵀF,</text>
<text x="700.0" y="190.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">      F в конусе трения,</text>
<text x="700.0" y="214.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">      |τ| ≤ τ<tspan baseline-shift="sub" font-size="72%">max</tspan>.</text>
<text x="700.0" y="238.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="700.0" y="262.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Решается заново ~1000 раз в секунду.</text>
</svg>
