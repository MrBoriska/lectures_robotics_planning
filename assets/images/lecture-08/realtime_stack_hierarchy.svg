<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(30, 24)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Многотактовая архитектура реального времени (1 Гц — 1000 Гц)</text>
    <text x="0" y="18" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Иерархия контуров управления робота от жесткого RT на микроконтроллере до планирования миссии</text>
  </g>
  <g transform="translate(30, 65)">
    <rect width="700" height="46" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="140" height="46" rx="6" fill="#ef4444"/>
    <text x="12" y="28" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#ffffff">1000 Гц (1 мс)</text>
    <text x="155" y="20" font-family="Inter" font-size="12.5" font-weight="700" fill="#991b1b">CAN / EtherCAT / Инверторы моторов</text>
    <text x="155" y="37" font-family="Inter" font-size="10.5" fill="#475569">Токовый контур, FOC, ШИМ, энкодеры колес. Жесткий RT, джиттер < 20 мкс</text>
  </g>
  <g transform="translate(30, 119)">
    <rect width="700" height="46" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.2"/>
    <rect x="0" y="0" width="140" height="46" rx="6" fill="#f97316"/>
    <text x="12" y="28" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#ffffff">100 Гц (10 мс)</text>
    <text x="155" y="20" font-family="Inter" font-size="12.5" font-weight="700" fill="#9a3412">IMU / Комплементарный фильтр / EKF</text>
    <text x="155" y="37" font-family="Inter" font-size="10.5" fill="#475569">Одометрия, слияние сенсоров, защита от опрокидывания шасси</text>
  </g>
  <g transform="translate(30, 173)">
    <rect width="700" height="46" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
    <rect x="0" y="0" width="140" height="46" rx="6" fill="#eab308"/>
    <text x="12" y="28" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#ffffff">20–50 Гц (20–50 мс)</text>
    <text x="155" y="20" font-family="Inter" font-size="12.5" font-weight="700" fill="#854d0e">Локальный планировщик (MPC / TEB / DWA)</text>
    <text x="155" y="37" font-family="Inter" font-size="10.5" fill="#475569">Уклонение от динамических преград, расчет ускорений, трекинг пути</text>
  </g>
  <g transform="translate(30, 227)">
    <rect width="700" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="0" y="0" width="140" height="46" rx="6" fill="#3b82f6"/>
    <text x="12" y="28" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#ffffff">1–5 Гц (0.2–1 с)</text>
    <text x="155" y="20" font-family="Inter" font-size="12.5" font-weight="700" fill="#1e40af">Глобальный планировщик (A* / Nav2 / GVD)</text>
    <text x="155" y="37" font-family="Inter" font-size="10.5" fill="#475569">Построение маршрута по статической карте, Dijkstra, Costmaps</text>
  </g>
  <g transform="translate(30, 281)">
    <rect width="700" height="46" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="140" height="46" rx="6" fill="#10b981"/>
    <text x="12" y="28" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#ffffff">0.1–1 Гц (1–10 с)</text>
    <text x="155" y="20" font-family="Inter" font-size="12.5" font-weight="700" fill="#065f46">Диспетчер миссии (Behavior Tree / FSM)</text>
    <text x="155" y="37" font-family="Inter" font-size="10.5" fill="#475569">Выбор целей, перезапуск упавших нод, взаимодействие с флотом</text>
  </g>
</svg>