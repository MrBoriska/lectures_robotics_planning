<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(30, 24)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Архитектура контура RTI (Real-Time Iteration, Diehl et al.)</text>
    <text x="0" y="18" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Разделение фаз вычислений для минимизации задержки обратной связи (Feedback Latency &lt; 1 мс)</text>
  </g>

  <g transform="translate(30, 75)">
    <rect width="400" height="240" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="400" height="32" rx="8" fill="#3b82f6"/>
    <text x="14" y="21" font-family="Inter" font-size="12.5" font-weight="700" fill="#ffffff">Фаза подготовки (Preparation Phase) ~ 10–30 мс</text>

    <g transform="translate(16, 50)" font-family="Inter" font-size="11.5" fill="#334155">
      <text x="0" y="0" font-weight="700">• Выполняется ДО поступления нового замера состояния</text>
      <text x="0" y="24">• Линеаризация нелинейной динамики робота f(x, u)</text>
      <text x="0" y="48">• Расчет матриц чувствительности: A_k = ∂f/∂x, B_k = ∂f/∂u</text>
      <text x="0" y="72">• Формирование гессиана H и конденсация QP-задачи</text>
      <text x="0" y="96">• Факторизация Холецкого (H = L L^T) или qpOASES / OSQP init</text>

      <rect x="0" y="115" width="368" height="42" rx="4" fill="#dbeafe"/>
      <text x="10" y="133" font-family="JetBrains Mono" font-size="10.5" fill="#1e40af">H = B^T Q B + R,  g = B^T Q (A x_ref)</text>
      <text x="10" y="148" font-family="Inter" font-size="10" fill="#1e40af">Тяжелая матричная алгебра завершена заранее!</text>
    </g>
  </g>

  <g transform="translate(455, 75)">
    <rect width="275" height="240" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <rect width="275" height="32" rx="8" fill="#10b981"/>
    <text x="14" y="21" font-family="Inter" font-size="12.5" font-weight="700" fill="#ffffff">Фаза отклика (Feedback) &lt; 1 мс</text>

    <g transform="translate(16, 50)" font-family="Inter" font-size="11.5" fill="#334155">
      <text x="0" y="0" font-weight="700" fill="#065f46">⚡ Триггер: пришел замер x(t₀)</text>
      <text x="0" y="24">• Обновление вектора градиента:</text>
      <text x="12" y="42" font-family="JetBrains Mono" font-size="10.5" fill="#047857">g_k = f(x(t₀) - x_ref)</text>
      <text x="0" y="66">• ОДНА итерация решения QP:</text>
      <text x="12" y="84" font-family="JetBrains Mono" font-size="10.5" fill="#047857">min 1/2 Δu^T H Δu + g^T Δu</text>
      <text x="0" y="108">• Немедленная выдача u₀* на моторы</text>

      <rect x="0" y="125" width="243" height="45" rx="4" fill="#bbf7d0"/>
      <text x="10" y="144" font-family="Inter" font-size="11" font-weight="700" fill="#065f46">Задержка обратной связи:</text>
      <text x="10" y="160" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#047857">Latency &lt; 200–500 мкс!</text>
    </g>
  </g>

  <g transform="translate(427, 180)">
    <path d="M0,0 H24 M16,-5 L24,0 L16,5" stroke="#059669" stroke-width="3" fill="none"/>
  </g>
</svg>