<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="430" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="32.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Основные семейства методов обучения с подкреплением</text>
<rect x="420.0" y="52.0" width="260.0" height="50.0" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
<text x="550.0" y="76.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Обучение с подкреплением</text>
<polyline points="550.0,102.0 550.0,118.0 295.0,118.0 295.0,134.0" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<polyline points="550.0,118.0 860.0,118.0 860.0,134.0" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="105.0" y="134.0" width="380.0" height="50.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="295.0" y="158.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Без модели среды (model-free)</text>
<rect x="670.0" y="134.0" width="380.0" height="50.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="860.0" y="158.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">С моделью среды (model-based)</text>
<polyline points="295.0,184.0 295.0,200.0 115.0,200.0 115.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="30.0" y="214.0" width="170.0" height="108.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="115.0" y="238.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">На основе ценности</text>
<text x="115.0" y="260.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">Q-learning, DQN</text>
<text x="115.0" y="279.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">политика: argmax<tspan baseline-shift="sub" font-size="72%">a</tspan> Q</text>
<text x="115.0" y="298.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">конечное множество A</text>
<polyline points="295.0,184.0 295.0,200.0 295.0,200.0 295.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="210.0" y="214.0" width="170.0" height="108.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="295.0" y="238.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Градиент политики</text>
<text x="295.0" y="260.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">REINFORCE</text>
<text x="295.0" y="279.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">π<tspan baseline-shift="sub" font-size="72%">θ</tspan>(a|s) напрямую</text>
<text x="295.0" y="298.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">высокая дисперсия</text>
<polyline points="295.0,184.0 295.0,200.0 475.0,200.0 475.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="390.0" y="214.0" width="170.0" height="108.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="475.0" y="238.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Актор–критик</text>
<text x="475.0" y="260.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">A2C, PPO (on-policy)</text>
<text x="475.0" y="279.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">DDPG, TD3, SAC</text>
<text x="475.0" y="298.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">(off-policy)</text>
<polyline points="860.0,184.0 860.0,200.0 760.0,200.0 760.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="670.0" y="214.0" width="180.0" height="108.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
<text x="760.0" y="238.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">Известная модель</text>
<text x="760.0" y="260.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">динамическое</text>
<text x="760.0" y="279.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">программирование,</text>
<text x="760.0" y="298.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">MCTS, MPC (лекция 05)</text>
<polyline points="860.0,184.0 860.0,200.0 960.0,200.0 960.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="870.0" y="214.0" width="180.0" height="108.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
<text x="960.0" y="238.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">Обучаемая модель</text>
<text x="960.0" y="260.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">Dyna, MBPO, PETS,</text>
<text x="960.0" y="279.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">Dreamer: обучение</text>
<text x="960.0" y="298.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">политики «в модели»</text>
<text x="30.0" y="352.0" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Ось «on-policy / off-policy»: используются ли для обновления только данные текущей политики</text>
<text x="30.0" y="372.0" font-size="14" fill="#475569" text-anchor="start" font-weight="400">(PPO) или любой накопленный опыт из буфера (DQN, SAC). Off-policy методы экономнее по данным,</text>
<text x="30.0" y="392.0" font-size="14" fill="#475569" text-anchor="start" font-weight="400">on-policy методы проще и устойчивее при массово-параллельной симуляции.</text>
</svg>
