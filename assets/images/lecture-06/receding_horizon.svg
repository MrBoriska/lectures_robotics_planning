<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(30, 24)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Принцип скользящего горизонта MPC (Receding Horizon)</text>
    <text x="0" y="18" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Оптимизация на горизонте N шагов, выполнение ТОЛЬКО первого действия u_0 и сдвиг окна на t + 1</text>
  </g>

  <line x1="50" y1="260" x2="710" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="715" y="264" font-family="JetBrains Mono" font-size="11.00" fill="#64748b"><tspan x="715.0" dy="0">Время</tspan><tspan x="715.0" dy="12.8">t</tspan></text>

  <rect x="230" y="75" width="320" height="200" fill="#eff6ff" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.8" rx="6"/>
  <text x="240" y="95" font-family="Inter" font-size="12" font-weight="700" fill="#1d4ed8">Горизонт предсказания (Prediction Horizon N)</text>

  <path d="M60,210 Q140,230 230,190" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <text x="90" y="240" font-family="Inter" font-size="10.5" fill="#64748b">Прошлые состояния (t &lt; t₀)</text>

  <circle cx="230" cy="190" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <text x="210" y="215" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#0284c7">x(t₀)</text>
  <line x1="230" y1="260" x2="230" y2="190" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="220" y="280" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#0284c7">t₀</text>

  <path d="M230,190 Q340,120 550,130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <text x="460" y="115" font-family="Inter" font-size="10" fill="#64748b">x_ref (Опорная траектория)</text>

  <path d="M230,190 Q320,150 420,145 T550,135" stroke="#059669" stroke-width="3" fill="none"/>
  <circle cx="300" cy="162" r="4.5" fill="#059669"/>
  <circle cx="380" cy="148" r="4.5" fill="#059669"/>
  <circle cx="470" cy="140" r="4.5" fill="#059669"/>
  <circle cx="550" cy="135" r="5" fill="#059669"/>
  <text x="350" y="170" font-family="Inter" font-size="11" font-weight="700" fill="#059669">Прогноз x_{t+k|t}</text>

  <g transform="translate(230, 190)">
    <line x1="0" y1="0" x2="70" y2="-28" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="70,-28 60,-32 62,-23" fill="#dc2626"/>
    <text x="15" y="-20" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#dc2626">u₀* (Выполняется!)</text>
  </g>

  <line x1="550" y1="260" x2="550" y2="75" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="535" y="280" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#1e40af">t₀ + N</text>

  <g transform="translate(270, 305)">
    <path d="M0,0 H120 M110,-5 L120,0 L110,5" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    <text x="15" y="-8" font-family="Inter" font-size="11" font-weight="700" fill="#0284c7">Сдвиг окна на t₀ + 1 с обратной связью</text>
  </g>
</svg>