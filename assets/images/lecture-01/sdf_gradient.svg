<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LEFT: ESDF ISOLINES -->
  <g transform="translate(20, 20)">
    <rect width="345" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1. Евклидово поле расстояний (ESDF)</text>
    <text x="16" y="39" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Изолинии расстояния d(x) = min_{p ∈ ∂O} ||x - p||</text>

    <!-- Isolines d = 80, 55, 30 -->
    <ellipse cx="150" cy="140" rx="130" ry="100" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" stroke-dasharray="3,3"/>
    <ellipse cx="150" cy="140" rx="105" ry="80" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="3,3"/>
    <ellipse cx="150" cy="140" rx="80" ry="60" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.6"/>

    <!-- Obstacle (d <= 0) -->
    <ellipse cx="150" cy="140" rx="50" ry="35" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="122" y="144" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Препятствие</text>

    <!-- Labels on isolines -->
    <text x="210" y="122" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0369a1">d = +0.5 м</text>
    <text x="235" y="102" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0284c7">d = +1.0 м</text>
    <text x="260" y="82" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0369a1">d = +1.5 м</text>

    <rect x="14" y="250" width="317" height="58" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="270" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0284c7">Свойства поля расстояний:</text>
    <text x="24" y="286" font-family="JetBrains Mono, monospace" font-size="10" fill="#334155">d(x) &gt; 0 в свободном пространстве, d(x) = 0 на границе</text>
    <text x="24" y="299" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Вычисляется на GPU через nvblox / VDB-EDT в реалтайме</text>
  </g>

  <!-- RIGHT: GRADIENT FIELD -->
  <g transform="translate(395, 20)">
    <rect width="345" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. Градиент ∇ESDF и силы отталкивания</text>
    <text x="16" y="39" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Векторы ∇d(x) перпендикулярны поверхности (нормали n)</text>

    <ellipse cx="150" cy="140" rx="50" ry="35" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="122" y="144" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Препятствие</text>
    <line x1="200.0" y1="140.0" x2="232.0" y2="140.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="232.0" cy="140.0" r="2" fill="#0284c7"/>
    <line x1="193.3" y1="157.5" x2="218.0" y2="177.9" stroke="#0284c7" stroke-width="2"/>
    <circle cx="218.0" cy="177.9" r="2" fill="#0284c7"/>
    <line x1="175.0" y1="170.3" x2="187.0" y2="200.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="187.0" cy="200.0" r="2" fill="#0284c7"/>
    <line x1="150.0" y1="175.0" x2="150.0" y2="207.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="150.0" cy="207.0" r="2" fill="#0284c7"/>
    <line x1="125.0" y1="170.3" x2="113.0" y2="200.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="113.0" cy="200.0" r="2" fill="#0284c7"/>
    <line x1="106.7" y1="157.5" x2="82.0" y2="177.9" stroke="#0284c7" stroke-width="2"/>
    <circle cx="82.0" cy="177.9" r="2" fill="#0284c7"/>
    <line x1="100.0" y1="140.0" x2="68.0" y2="140.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="68.0" cy="140.0" r="2" fill="#0284c7"/>
    <line x1="106.7" y1="122.5" x2="82.0" y2="102.1" stroke="#0284c7" stroke-width="2"/>
    <circle cx="82.0" cy="102.1" r="2" fill="#0284c7"/>
    <line x1="125.0" y1="109.7" x2="113.0" y2="80.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="113.0" cy="80.0" r="2" fill="#0284c7"/>
    <line x1="150.0" y1="105.0" x2="150.0" y2="73.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="150.0" cy="73.0" r="2" fill="#0284c7"/>
    <line x1="175.0" y1="109.7" x2="187.0" y2="80.0" stroke="#0284c7" stroke-width="2"/>
    <circle cx="187.0" cy="80.0" r="2" fill="#0284c7"/>
    <line x1="193.3" y1="122.5" x2="218.0" y2="102.1" stroke="#0284c7" stroke-width="2"/>
    <circle cx="218.0" cy="102.1" r="2" fill="#0284c7"/>

    <rect x="14" y="250" width="317" height="58" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="270" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#059669">Непрерывный градиент для оптимизаторов:</text>
    <text x="24" y="286" font-family="JetBrains Mono, monospace" font-size="10" fill="#0f172a">F_rep = -∇ESDF(x) / ||∇ESDF||  (Единичный вектор)</text>
    <text x="24" y="299" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Обеспечивает C¹-гладкость функционала в CHOMP, TrajOpt и MPC</text>
  </g>
</svg>