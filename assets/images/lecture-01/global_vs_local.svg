<text x="744.0" y="67.0" font-size="16" fill="#2563eb" text-anchor="start" font-weight="700">Глобальный путь σ(s)</text>
<text x="744.0" y="92.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">по всей известной карте, от старта до цели;</text>
<text x="744.0" y="112.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">пересчёт редко: 0.2–2 Гц или по запросу</text>
<rect x="700.0" y="150.0" width="34.0" height="22.0" rx="3" fill="#f0f9ff" stroke="#2563eb" stroke-width="2"/>
<text x="744.0" y="167.0" font-size="16" fill="#2563eb" text-anchor="start" font-weight="700">Окно 2–8 м вокруг робота</text>
<text x="744.0" y="192.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">видит только то, что сейчас измерил датчик</text>
<text x="744.0" y="212.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">(лучи); пересчёт 20–50 Гц. Жёлтый круг —</text>
<text x="744.0" y="232.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">новое препятствие, которого нет на карте</text>
<line x1="700.0" y1="266.0" x2="734.0" y2="266.0" stroke="#059669" stroke-width="3.2" marker-end="url(#arrG)"/>
<text x="744.0" y="271.0" font-size="16" fill="#059669" text-anchor="start" font-weight="700">Локальная траектория</text>
<text x="744.0" y="296.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">обходит новое препятствие и возвращается</text>
<text x="744.0" y="316.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">к глобальному пути; на выходе (v, ω)</text>
