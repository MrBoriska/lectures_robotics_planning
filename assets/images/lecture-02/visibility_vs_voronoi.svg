<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LEFT PANEL: EXACT VISIBILITY GRAPH -->
  <g transform="translate(20, 20)">
    <rect width="345" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1. Граф видимости (Visibility Graph)</text>
    <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Ребра соединяют вершины без пересечения препятствий</text>

    <!-- Obstacles -->
    <polygon points="75,70 145,55 130,135 65,115" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <polygon points="185,110 265,80 250,165 175,145" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="90" y="100" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#991b1b">O₁</text>
    <text x="210" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#991b1b">O₂</text>

    <!-- Computed Visibility Edges -->
    <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7">
      <line x1="30" y1="160" x2="75" y2="70"/>
      <line x1="30" y1="160" x2="130" y2="135"/>
      <line x1="30" y1="160" x2="65" y2="115"/>
      <line x1="30" y1="160" x2="250" y2="165"/>
      <line x1="30" y1="160" x2="175" y2="145"/>
      <line x1="320" y1="140" x2="265" y2="80"/>
      <line x1="320" y1="140" x2="250" y2="165"/>
      <line x1="75" y1="70" x2="145" y2="55"/>
      <line x1="75" y1="70" x2="65" y2="115"/>
      <line x1="145" y1="55" x2="130" y2="135"/>
      <line x1="145" y1="55" x2="185" y2="110"/>
      <line x1="145" y1="55" x2="265" y2="80"/>
      <line x1="145" y1="55" x2="175" y2="145"/>
      <line x1="130" y1="135" x2="65" y2="115"/>
      <line x1="130" y1="135" x2="185" y2="110"/>
      <line x1="130" y1="135" x2="250" y2="165"/>
      <line x1="130" y1="135" x2="175" y2="145"/>
      <line x1="185" y1="110" x2="265" y2="80"/>
      <line x1="185" y1="110" x2="175" y2="145"/>
      <line x1="265" y1="80" x2="250" y2="165"/>
      <line x1="250" y1="165" x2="175" y2="145"/>
    </g>

    <!-- Shortest Path Computed via Dijkstra -->
    <path d="M30,160 L250,165 L320,140" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="160" r="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="250" cy="165" r="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="320" cy="140" r="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Start & Goal -->
    <circle cx="30" cy="160" r="6" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="164" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#059669">S</text>
    <circle cx="320" cy="140" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="328" y="144" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#dc2626">G</text>

    <!-- Metrics box -->
    <rect x="14" y="245" width="317" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="266" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">✓ Глобально минимальная длина: L = 294.4 px</text>
    <text x="24" y="284" font-family="Inter, sans-serif" font-size="11" fill="#b91c1c">✗ Нулевой зазор (клиренс = 0): путь скользит по углам!</text>
    <text x="24" y="299" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748b">Ребер в графе: 21 | Алгоритмическая сложность: O(n² log n)</text>
  </g>

  <!-- RIGHT PANEL: GENERALIZED VORONOI DIAGRAM -->
  <g transform="translate(395, 20)">
    <rect width="345" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. Диаграмма Вороного (GVD / Voronoi)</text>
    <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Ребра равноудалены от ближайших препятствий (максимальный клиренс)</text>

    <!-- Obstacles -->
    <polygon points="75,70 145,55 130,135 65,115" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <polygon points="185,110 265,80 250,165 175,145" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="90" y="100" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#991b1b">O₁</text>
    <text x="210" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#991b1b">O₂</text>

    <!-- Voronoi Skeleton -->
    <g stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6">
      <line x1="155" y1="20" x2="155" y2="240"/>
      <line x1="155" y1="140" x2="210" y2="50"/>
      <line x1="155" y1="195" x2="280" y2="240"/>
      <line x1="20" y1="95" x2="75" y2="20"/>
      <line x1="20" y1="205" x2="155" y2="195"/>
      <line x1="215" y1="205" x2="330" y2="220"/>
      <line x1="210" y1="50" x2="330" y2="30"/>
    </g>

    <!-- Voronoi Clearance Path -->
    <path d="M30,160 L60,205 L155,195 L215,205 L280,185 L320,140" stroke="#059669" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="160" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="60" cy="205" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="155" cy="195" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="215" cy="205" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="280" cy="185" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="320" cy="140" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Start & Goal -->
    <circle cx="30" cy="160" r="6" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="164" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#059669">S</text>
    <circle cx="320" cy="140" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="328" y="144" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#dc2626">G</text>

    <!-- Clearance circle illustration -->
    <circle cx="155" cy="195" r="35" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="155" y1="195" x2="135" y2="165" stroke="#10b981" stroke-width="1.2"/>
    <text x="145" y="180" font-family="JetBrains Mono, monospace" font-size="9" fill="#047857">d_max</text>

    <!-- Metrics box -->
    <rect x="14" y="245" width="317" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="266" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#059669">✓ Максимальный запас безопасности (клиренс d &gt; 35 px)</text>
    <text x="24" y="284" font-family="Inter, sans-serif" font-size="11" fill="#b45309">✗ Удлинение пути: L = 338.7 px (+15.0%)</text>
    <text x="24" y="299" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748b">Оптимизирует: argmax min d(q, ∂O) | Метод ретракции</text>
  </g>
</svg>