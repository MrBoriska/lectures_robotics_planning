    <line x1="20" y1="140" x2="90" y2="110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="110" y1="40" x2="180" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
