<text x="110.0" y="294.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Модель: ẋ₁ = x₂,  ẋ₂ = u. Старт: x = (−1; 0). Цель: x = (0; 0).</text>
