<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <marker id="arr-c-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-c-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(25, 20)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Аналитическое решение краевой задачи (BVP): Дубинс vs Ридс–Шеппа</text>
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Замкнутый расчет кратчайшего пути для колесной кинематики без препятствий за &lt; 1 мкс</text>
  </g>

  <!-- Left: Dubins -->
  <g transform="translate(20, 50)">
    <rect width="350" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-family="Inter" font-size="12" font-weight="700" fill="#0f172a">1. Кривые Дубинса (Dubins, 1957)</text>
    <text x="14" y="37" font-family="Inter" font-size="10" fill="#0284c7">Движение только вперёд (v &gt; 0) • БПЛА, самолёты</text>

    <!-- Circles -->
    <circle cx="162.8" cy="109.1" r="15.1" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="224.6" cy="65.3" r="15.1" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 153.1,97.6 L 153.3,97.4 L 153.6,97.2 L 153.8,97.0 L 154.1,96.8 L 154.3,96.7 L 154.6,96.5 L 154.8,96.3 L 155.1,96.2 L 155.4,96.0 L 155.6,95.9 L 155.9,95.7 L 156.2,95.6 L 156.5,95.4 L 156.7,95.3 L 157.0,95.2 L 157.3,95.1 L 157.6,95.0 L 157.9,94.9 L 158.2,94.8 L 158.5,94.7 L 158.8,94.6 L 159.1,94.5 L 159.4,94.4 L 159.7,94.4 L 227.7,80.1 L 231.1,78.9 L 234.1,77.0 L 236.6,74.4 L 238.4,71.3 L 239.5,67.9 L 239.7,64.3 L 239.0,60.7 L 237.5,57.5 L 235.3,54.7 L 232.5,52.4 L 229.2,50.9 L 225.7,50.3 L 222.1,50.4 L 218.6,51.4 L 215.5,53.2 L 212.9,55.7 L 211.0,58.8 L 209.9,62.2 L 209.5,65.7 L 210.1,69.3 L 211.4,72.6 L 213.5,75.5 L 216.2,77.9 L 219.5,79.5" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Start / Goal -->
    <circle cx="153.1" cy="97.6" r="4.5" fill="#0f172a"/>
    <line x1="153.1" y1="97.6" x2="166.9" y2="86.0" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-c-navy)"/>
    <text x="149.1" y="113.6" font-family="Inter" font-size="9" font-weight="700" fill="#0f172a">Старт q_s</text>

    <circle cx="219.5" cy="79.5" r="4.5" fill="#059669"/>
    <line x1="219.5" y1="79.5" x2="236.4" y2="85.6" stroke="#059669" stroke-width="2" marker-end="url(#arr-c-green)"/>
    <text x="205.5" y="95.5" font-family="Inter" font-size="9" font-weight="700" fill="#059669">Цель q_g</text>

    <rect x="12" y="190" width="326" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="175" y="206" text-anchor="middle" font-family="Inter" font-size="9" font-weight="600" fill="#1e40af">6 слов: CSC (LSL, RSR, LSR, RSL) и CCC (LRL, RLR)</text>
  </g>

  <!-- Right: Reeds-Shepp -->
  <g transform="translate(390, 50)">
    <rect width="350" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-family="Inter" font-size="12" font-weight="700" fill="#0f172a">2. Кривые Ридса–Шеппа (1990)</text>
    <text x="14" y="37" font-family="Inter" font-size="10" fill="#dc2626">Вперёд и назад (v = ±1) • Колёсные роботы, авто</text>

    <path d="M 130.4,101.0 L 132.0,100.4 L 133.6,99.7 L 135.1,98.9 L 136.6,98.1 L 138.1,97.2 L 139.5,96.2 L 140.9,95.2 L 142.3,94.2 L 143.6,93.1 L 144.9,91.9 L 146.2,90.7 L 147.4,89.5 L 148.5,88.2 L 149.6,86.9 L 150.6,85.5 L 151.6,84.1 L 152.6,82.6 L 153.4,81.1 L 154.3,79.6 L 155.0,78.1 L 155.7,76.5 L 156.4,74.9 L 157.0,73.3 L 157.5,71.6 L 157.9,70.0 L 158.3,68.3 L 158.7,66.6 L 158.9,64.9 L 159.1,63.2 L 159.2,61.5 L 159.3,59.7 L 159.3,58.0" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 159.3,58.0 L 159.4,60.3 L 159.7,62.7 L 160.0,65.0 L 160.5,67.3 L 161.1,69.5 L 161.8,71.8 L 162.7,74.0 L 163.6,76.1 L 164.7,78.2 L 165.8,80.2 L 167.1,82.2 L 168.5,84.1 L 169.9,85.9 L 171.5,87.7 L 173.1,89.4 L 174.8,90.9 L 176.6,92.4 L 178.5,93.8 L 180.5,95.1 L 182.5,96.3 L 184.6,97.4 L 186.7,98.4 L 188.9,99.2 L 191.1,100.0 L 193.3,100.6 L 195.6,101.2 L 197.9,101.6 L 200.3,101.8 L 202.6,102.0 L 204.9,102.0 L 207.3,102.0 L 209.6,101.7" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="5,3"/>
    <path d="M 209.6,101.7 L 208.0,101.9 L 206.4,102.2 L 204.9,102.5 L 203.3,102.9 L 201.8,103.3 L 200.2,103.8 L 198.7,104.3 L 197.2,104.9 L 195.8,105.5 L 194.3,106.2 L 192.9,106.9 L 191.5,107.7 L 190.1,108.5 L 188.8,109.4 L 187.5,110.4 L 186.2,111.3 L 185.0,112.4 L 183.8,113.4 L 182.6,114.5 L 181.5,115.7 L 180.4,116.9 L 179.4,118.1 L 178.4,119.3 L 177.4,120.6 L 176.5,122.0 L 175.7,123.3 L 174.9,124.7 L 174.1,126.1 L 173.4,127.5 L 172.8,129.0 L 172.2,130.5 L 171.6,132.0" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Cusps -->
    <circle cx="159.3" cy="58.0" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <text x="159.3" y="50.0" text-anchor="middle" font-family="Inter" font-size="8.5" font-weight="700" fill="#d97706">Cusp 1</text>
    <circle cx="209.6" cy="101.7" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <text x="227.6" y="105.7" text-anchor="middle" font-family="Inter" font-size="8.5" font-weight="700" fill="#d97706">Cusp 2</text>

    <!-- Start / Goal -->
    <circle cx="130.4" cy="101.0" r="4.5" fill="#0f172a"/>
    <line x1="130.4" y1="101.0" x2="147.3" y2="94.9" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-c-navy)"/>
    <text x="106.4" y="117.0" font-family="Inter" font-size="9" font-weight="700" fill="#0f172a">Старт q_s</text>

    <circle cx="171.6" cy="132.0" r="4.5" fill="#059669"/>
    <line x1="171.6" y1="132.0" x2="165.4" y2="148.9" stroke="#059669" stroke-width="2" marker-end="url(#arr-c-green)"/>
    <text x="179.6" y="148.0" font-family="Inter" font-size="9" font-weight="700" fill="#059669">Цель q_g</text>

    <rect x="12" y="190" width="326" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="175" y="206" text-anchor="middle" font-family="Inter" font-size="9" font-weight="600" fill="#9f1239">48 шаблонов (9 семейств): C|C|C, CSC, CC|C, C|CC ...</text>
  </g>

  <!-- Bottom Banner: Role in Hybrid A* -->
  <g transform="translate(20, 287)">
    <rect width="720" height="58" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="16" y="20" font-family="Inter" font-size="11" font-weight="700" fill="#065f46">🎯 Роль в Hybrid A*: почему это критично для планирования?</text>
    <text x="16" y="36" font-family="Inter" font-size="9.5" fill="#047857">1. Допустимая эвристика h_nonhol(q): точная аналитическая длина Ридса–Шеппа в SE(2) без препятствий направляет поиск.</text>
    <text x="16" y="50" font-family="Inter" font-size="9.5" fill="#047857">2. Аналитическое расширение (Analytic Expansion): мгновенное прямое попадание в цель q_goal при отсутствии коллизий (&lt; 1 мкс)!</text>
  </g>
</svg>