<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(20, 20)">
    <rect width="345" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1. Классический метод Хатиба (APF)</text>
    <text x="16" y="39" font-family="Inter, sans-serif" font-size="11" fill="#dc2626">Патология: U-ловушка и локальный минимум ∇U = 0</text>

    <path d="M120,70 V190 H220 V70" stroke="#ef4444" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="145" y="145" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">U-ловушка</text>

    <circle cx="170" cy="40" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="185" y="44" font-family="Inter" font-size="11" font-weight="700" fill="#0284c7">Цель (G)</text>

    <path d="M170,270 L170,165" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="270" r="5" fill="#059669"/>
    <text x="150" y="290" font-family="Inter" font-size="10.5" fill="#059669">Старт (S)</text>

    <circle cx="170" cy="165" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <circle cx="170" cy="165" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>

    <line x1="170" y1="165" x2="170" y2="135" stroke="#0284c7" stroke-width="2"/>
    <text x="175" y="145" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#0284c7">F_att ↑</text>
    <line x1="170" y1="165" x2="170" y2="195" stroke="#ef4444" stroke-width="2"/>
    <text x="175" y="190" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#ef4444">F_rep ↓</text>

    <rect x="14" y="240" width="317" height="68" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="24" y="260" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Суммарная сила F_net = F_att + F_rep = 0</text>
    <text x="24" y="278" font-family="Inter, sans-serif" font-size="10.5" fill="#7f1d1d">Робот парализован: притяжение к цели строго равно отталкиванию от дна тупика!</text>
  </g>

  <g transform="translate(395, 20)">
    <rect width="345" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. Гармоническое поле (Harmonic Field)</text>
    <text x="16" y="39" font-family="Inter, sans-serif" font-size="11" fill="#059669">Уравнение Лапласа ∇²φ = 0 (Принцип максимума)</text>

    <path d="M120,70 V190 H220 V70" stroke="#94a3b8" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="145" y="145" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569">Преграда</text>

    <circle cx="170" cy="40" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="185" y="44" font-family="Inter" font-size="11" font-weight="700" fill="#0284c7">φ = 0 (Goal)</text>

    <path d="M170,270 Q170,210 95,200 Q75,120 120,55 Q145,40 170,40" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M170,270 Q170,210 245,200 Q265,120 220,55 Q195,40 170,40" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>

    <circle cx="170" cy="270" r="5" fill="#059669"/>
    <text x="150" y="290" font-family="Inter" font-size="10.5" fill="#059669">Старт (S)</text>

    <rect x="14" y="240" width="317" height="68" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="24" y="260" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">Принцип максимума гармонических функций:</text>
    <text x="24" y="278" font-family="Inter, sans-serif" font-size="10.5" fill="#047857">Экстремумы достигаются ТОЛЬКО на границах! Внутри свободной зоны локальные минимумы невозможны.</text>
  </g>
</svg>