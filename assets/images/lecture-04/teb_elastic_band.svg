<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(30, 24)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Timed Elastic Band (TEB): Оптимизация ленты состояний и гомотопии</text>
    <text x="0" y="18" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Траектория B = {s_i, Δt_i} деформируется как упругая лента под действием виртуальных сил</text>
  </g>

  <circle cx="360" cy="170" r="42" fill="#fee2e2" stroke="#ef4444" stroke-width="2.2"/>
  <text x="328" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Препятствие</text>

  <path d="M90,240 Q180,85 360,85 Q520,85 640,240" stroke="#059669" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="325" y="70" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#059669">Класс гомотопии H₁ (Оптимум)</text>

  <path d="M90,240 Q220,285 360,285 Q500,285 640,240" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <text x="325" y="305" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Класс гомотопии H₂</text>

  <line x1="360" y1="128" x2="360" y2="88" stroke="#ef4444" stroke-width="2"/>
  <circle cx="360" cy="88" r="2.5" fill="#ef4444"/>
  <text x="368" y="112" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#ef4444">F_rep</text>

  <g fill="#0284c7" stroke="#ffffff" stroke-width="1.5">
    <circle cx="90" cy="240" r="5"/>
    <circle cx="160" cy="150" r="5"/>
    <circle cx="250" cy="95" r="5"/>
    <circle cx="360" cy="85" r="5"/>
    <circle cx="470" cy="95" r="5"/>
    <circle cx="560" cy="150" r="5"/>
    <circle cx="640" cy="240" r="5"/>
  </g>

  <text x="180" y="120" font-family="JetBrains Mono" font-size="9" fill="#0284c7">Δt₁</text>
  <text x="290" y="80" font-family="JetBrains Mono" font-size="9" fill="#0284c7">Δt₂</text>

  <circle cx="90" cy="240" r="8" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <text x="75" y="265" font-family="Inter" font-size="11.5" font-weight="700" fill="#059669">Старт s₀</text>

  <circle cx="640" cy="240" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="625" y="265" font-family="Inter" font-size="11.5" font-weight="700" fill="#dc2626">Цель s_N</text>

  <rect x="30" y="275" width="260" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="295" font-family="JetBrains Mono" font-size="10.5" font-weight="700" fill="#0f172a">V(B) = ∑ (w_t·Δt_i² + w_obs·f_obs)</text>
  <text x="40" y="315" font-family="Inter" font-size="10" fill="#64748b">Оптимизирует время проезда и кинематику</text>
  <text x="40" y="328" font-family="Inter" font-size="10" fill="#64748b">одновременно с расстоянием до преград</text>
</svg>