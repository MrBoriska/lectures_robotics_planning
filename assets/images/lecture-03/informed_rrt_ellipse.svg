    <circle cx="408.8" cy="112.5" r="2.5"/>
    <circle cx="423.4" cy="272.9" r="2.5"/>
  </g>

  <!-- The Prolate Hyperspheroid / Ellipse -->
  <ellipse cx="260.0" cy="175.0" rx="165.0" ry="101.61200716450787" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>

  <!-- Inside accepted samples (Green) -->
  <g fill="#059669">
    <circle cx="170.9" cy="101.9" r="3"/>
    <circle cx="353.6" cy="221.7" r="3"/>
    <circle cx="148.6" cy="176.4" r="3"/>
    <circle cx="319.4" cy="186.9" r="3"/>
    <circle cx="149.3" cy="198.6" r="3"/>
    <circle cx="381.1" cy="227.3" r="3"/>
    <circle cx="196.7" cy="84.0" r="3"/>
    <circle cx="397.6" cy="202.4" r="3"/>
    <circle cx="381.6" cy="235.7" r="3"/>
    <circle cx="211.9" cy="188.7" r="3"/>
    <circle cx="390.4" cy="206.3" r="3"/>
    <circle cx="403.2" cy="195.4" r="3"/>
    <circle cx="152.2" cy="119.4" r="3"/>
    <circle cx="313.7" cy="139.3" r="3"/>
    <circle cx="208.6" cy="98.3" r="3"/>
    <circle cx="318.6" cy="203.8" r="3"/>
    <circle cx="129.8" cy="235.5" r="3"/>
    <circle cx="126.7" cy="143.2" r="3"/>
