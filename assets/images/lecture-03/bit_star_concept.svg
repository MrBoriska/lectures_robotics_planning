<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Legend -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">BIT*: Синтез A* и сэмплирования</text>
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Батчи точек + Очередь рёбер A* (g + h) + Отложенные коллизии</text>
  </g>

  <!-- Search Space Boundary -->
  <rect x="24" y="58" width="472" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Informed Ellipse (c_best) -->
  <ellipse cx="260" cy="170" rx="195" ry="98" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="365" y="88" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#2563eb">Эллипс c_best</text>

  <!-- Obstacles -->
  <circle cx="210" cy="130" r="32" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="134" font-family="Inter, sans-serif" font-size="9" fill="#64748b">C_obs</text>
  <circle cx="310" cy="205" r="34" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="295" y="209" font-family="Inter, sans-serif" font-size="9" fill="#64748b">C_obs</text>

  <!-- Batch Samples in Ellipse (unconnected) -->
  <g fill="#94a3b8">
    <circle cx="150" cy="115" r="3"/>
    <circle cx="185" cy="225" r="3"/>
    <circle cx="230" cy="175" r="3"/>
    <circle cx="280" cy="120" r="3"/>
    <circle cx="345" cy="140" r="3"/>
    <circle cx="370" cy="210" r="3"/>
    <circle cx="415" cy="165" r="3"/>
  </g>

  <!-- Existing Tree (Solid Blue / Navy) -->
  <g stroke="#1e40af" stroke-width="2.5" stroke-linecap="round">
    <line x1="90" y1="170" x2="140" y2="175"/>
    <line x1="140" y1="175" x2="175" y2="155"/>
    <line x1="140" y1="175" x2="160" y2="210"/>
  </g>

  <!-- Validated Tree Vertices -->
  <circle cx="140" cy="175" r="5" fill="#1e40af"/>
  <circle cx="175" cy="155" r="5" fill="#1e40af"/>
  <circle cx="160" cy="210" r="5" fill="#1e40af"/>

  <!-- Priority Queue Candidate Edges (A* f-value) -->
  <!-- Edge under test (Green): Passed lazy check -->
  <line x1="175" y1="155" x2="265" y2="145" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="265" cy="145" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <text x="210" y="142" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#059669">min f(u,v)</text>

  <!-- Blocked Candidate Edge (Red dashed): Lazy check fails -->
  <line x1="175" y1="155" x2="210" y2="130" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="176" y="128" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626">✗ Коллизия</text>

  <!-- Future Queued Edges (Orange dashed) -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="265" y1="145" x2="345" y2="140"/>
    <line x1="160" y1="210" x2="230" y2="175"/>
    <line x1="265" y1="145" x2="430" y2="170"/>
  </g>

  <!-- Start and Goal Nodes -->
  <!-- Start -->
  <circle cx="90" cy="170" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <text x="90" y="174" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="68" y="195" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0f172a">q_start</text>

  <!-- Goal -->
  <circle cx="430" cy="170" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <text x="430" y="174" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">G</text>
  <text x="415" y="195" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0f172a">q_goal</text>

  <!-- Badge: Lazy Collision Check -->
  <rect x="35" y="68" width="180" height="24" rx="5" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="43" y="84" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#92400e">⚡ Отложенная проверка коллизий</text>

  <!-- Heuristic Explanation Card (Bottom) -->
  <g transform="translate(24, 305)">
    <rect width="472" height="232" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Title of formula box -->
    <text x="18" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Функция приоритета ребра (u, v) в очереди A*:</text>

    <!-- Formula Banner -->
    <rect x="18" y="34" width="436" height="42" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="28" y="60" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e40af">f_hat(u, v) = g_tree(u) + ||u - v|| + h_goal(v)</text>

    <!-- 3 Key Features -->
    <g transform="translate(18, 92)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11" fill="#334155">
        <tspan font-weight="700" fill="#1d4ed8">1. Батчи (Batches):</tspan> строит случайный граф (RGG), уплотняя его итеративно.
      </text>
      <text x="0" y="38" font-family="Inter, sans-serif" font-size="11" fill="#334155">
        <tspan font-weight="700" fill="#059669">2. Эвристический порядок:</tspan> ребра раскрываются строго от лучших к худшим по f.
      </text>
      <text x="0" y="62" font-family="Inter, sans-serif" font-size="11" fill="#334155">
        <tspan font-weight="700" fill="#d97706">3. Ленивая валидация (Lazy):</tspan> проверка коллизий только при извлечении из очереди!
      </text>
      <text x="0" y="86" font-family="Inter, sans-serif" font-size="11" fill="#334155">
        <tspan font-weight="700" fill="#7c3aed">4. Архитектура для GPU:</tspan> батчевая модель идеально параллелится (cuRobo).
      </text>
    </g>
  </g>
</svg>
