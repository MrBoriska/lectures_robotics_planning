<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <rect x="-2" y="-14" width="170" height="18" rx="4" fill="#ecfdf5"/>
    <text x="6" y="-1" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#047857">ШАГ 2: ПЕРЕПОДКЛЮЧЕНИЕ</text>
    <text x="0" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Оператор Rewire: оптимизация дерева через q_new</text>
    <text x="0" y="31" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Проверка соседей v ∈ Near: если путь через q_new короче, ребро заменяется</text>
  </g>

  <!-- Ball of radius r Near(q_new, r) -->
  <circle cx="265" cy="230" r="145" fill="#ecfdf5" fill-opacity="0.3" stroke="#34d399" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="210" y="390" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#059669">шар окрестности r_RRT* = 145</text>

  <!-- Inactive tree branches (Gray) -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
    <line x1="45" y1="230" x2="110" y2="310"/>
    <line x1="110" y1="310" x2="185" y2="338"/>
    <line x1="185" y1="338" x2="265" y2="335"/>
    <line x1="265" y1="335" x2="365" y2="310"/>
    <line x1="110" y1="165" x2="245" y2="125"/>
  </g>

  <!-- Optimal Path to q_new (Blue) -->
  <g stroke="#0284c7" stroke-width="3.2" stroke-linecap="round">
    <line x1="45" y1="230" x2="110" y2="165"/>
    <line x1="110" y1="165" x2="185" y2="190"/>
    <line x1="185" y1="190" x2="265" y2="230"/>
  </g>

  <!-- Subtree edges from v to children w1, w2 (Green dashed) -->
  <g stroke="#059669" stroke-width="2" stroke-dasharray="3,2">
    <line x1="385" y1="165" x2="475" y2="142"/>
    <line x1="385" y1="165" x2="475" y2="178"/>
  </g>

  <!-- Cascade aura around subtree w1, w2 -->
  <rect x="440" y="105" width="94" height="112" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="447" y="122" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#047857">Поддерево v</text>
  <text x="447" y="206" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#059669">Выигрыш Δ = -3.0</text>

  <!-- OLD SUBOPTIMAL EDGE (p_old -> v) - CUT OFF -->
  <line x1="245" y1="125" x2="385" y2="165" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Cross icon on old edge -->
  <circle cx="315.0" cy="145.0" r="11" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="310.0" y="149.0" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#dc2626">✗</text>

  <!-- CALLOUT 1: NEW OPTIMAL PATH BADGE (In open top-left area) -->
  <g transform="translate(18, 58)" filter="url(#shadow)">
    <rect width="220" height="44" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="8" y="17" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#047857">✓ Новый путь через q_new:</text>
    <text x="8" y="33" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#059669">10.0 + 2.5 = 12.5 (ЛУЧШЕ на -3.0!)</text>
  </g>

  <!-- CALLOUT 2: OLD SUBOPTIMAL PATH BADGE (Above old edge) -->
  <g transform="translate(258, 58)" filter="url(#shadow)">
    <rect width="220" height="44" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="8" y="17" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#dc2626">✗ Старый путь через p_old:</text>
    <text x="8" y="33" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#991b1b">9.5 + 6.0 = 15.5 (ОТСЕКАЕТСЯ)</text>
  </g>

  <!-- NEW REWIRED EDGE (q_new -> v) -->
  <line x1="265" y1="230" x2="385" y2="165" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Distance d=2.5 badge on rewired edge -->
  <rect x="306" y="196" width="38" height="16" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="310" y="208" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#059669">d=2.5</text>

  <!-- Node v status pill (centered above node v) -->
  <g transform="translate(329, 131)" filter="url(#shadow)">
    <rect width="112" height="19" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
    <text x="56" y="13" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#047857">v (сосед: c=12.5)</text>
  </g>

  <!-- Unchanged Neighbor v2 check -->
  <line x1="265" y1="230" x2="365" y2="310" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <g transform="translate(270, 335)">
    <rect width="245" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="8" y="12" font-family="Inter, sans-serif" font-size="8.5" fill="#475569">Сосед v2 (c=11.0):</text>
    <text x="8" y="21" font-family="JetBrains Mono, monospace" font-size="8" fill="#64748b">10.0 + 2.5 = 12.5 ≥ 11.0 → Без изменений (—)</text>
  </g>

  <!-- Nodes -->
  <!-- q_start -->
  <circle cx="45" cy="230" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
  <text x="27" y="250" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0f172a">q_start</text>

  <!-- Node A -->
  <circle cx="110" cy="165" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="88" y="157" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#0284c7">c=4.0</text>

  <!-- Node B, C, q_near -->
  <circle cx="110" cy="310" r="4.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="185" cy="338" r="4.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="265" cy="335" r="4.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Old parent p_old -->
  <circle cx="245" cy="125" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.8"/>
  <text x="220" y="115" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#dc2626">p_old (c=9.5)</text>

  <!-- Node u* -->
  <circle cx="185" cy="190" r="6.5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <text x="173" y="208" font-family="JetBrains Mono, monospace" font-size="9" fill="#0284c7">u*(7.0)</text>

  <!-- Node q_new -->
  <circle cx="265" cy="230" r="8.5" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="247" y="250" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">q_new</text>
  <text x="243" y="262" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#0369a1">cost=10.0</text>

  <!-- Target Rewired Node v -->
  <circle cx="385" cy="165" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Subtree children w1, w2 -->
  <circle cx="475" cy="142" r="4.5" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="482" y="146" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#059669">w1</text>
  <circle cx="475" cy="178" r="4.5" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="482" y="182" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#059669">w2</text>

  <!-- Node v2 -->
  <circle cx="365" cy="310" r="5.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="373" y="314" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748b">v2(11.0)</text>

  <!-- Bottom Summary Card -->
  <g transform="translate(18, 395)">
    <rect width="504" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Formula -->
    <rect x="12" y="8" width="480" height="28" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="27" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#065f46">if cost(q_new) + ||q_new - v|| &lt; cost(v) ⟹ v.parent = q_new</text>

    <!-- Key takeaways -->
    <text x="14" y="54" font-family="Inter, sans-serif" font-size="10.2" fill="#334155">
      <tspan font-weight="700" fill="#059669">• Переподключение v:</tspan> путь через q_new короче (12.5 &lt; 15.5), старое ребро отсекается.
    </text>
    <text x="14" y="72" font-family="Inter, sans-serif" font-size="10.2" fill="#334155">
      <tspan font-weight="700" fill="#0284c7">• Каскадный выигрыш:</tspan> стоимость всех потомков v падает на Δ = -3.0. Дерево сходится к оптимуму!
    </text>
  </g>
</svg>