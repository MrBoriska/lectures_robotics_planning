<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(30, 24)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Кинематика велосипеда и геометрия руления Аккермана</text>
    <text x="0" y="18" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Все колеса катятся без бокового проскальзывания вокруг общего Мгновенного Центра Вращения (ICR)</text>
  </g>

  <circle cx="140" cy="60" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="48" font-family="Inter" font-size="12" font-weight="700" fill="#dc2626">ICR (МЦВ)</text>

  <g transform="translate(360, 180)">
    <rect x="-40" y="-80" width="80" height="160" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

    <line x1="-50" y1="50" x2="50" y2="50" stroke="#0f172a" stroke-width="3"/>
    <rect x="-56" y="32" width="12" height="36" rx="2" fill="#1e293b"/>
    <rect x="44" y="32" width="12" height="36" rx="2" fill="#1e293b"/>
    <text x="-35" y="70" font-family="Inter" font-size="10" fill="#64748b">Задний мост</text>

    <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#0f172a" stroke-width="3"/>
    <g transform="translate(-48, -50) rotate(-34)">
      <rect x="-6" y="-18" width="12" height="36" rx="2" fill="#0284c7"/>
    </g>
    <g transform="translate(48, -50) rotate(-23)">
      <rect x="-6" y="-18" width="12" height="36" rx="2" fill="#0284c7"/>
    </g>

    <line x1="68" y1="-50" x2="68" y2="50" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="74" y="5" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#475569">База L</text>
    <line x1="-48" y1="-95" x2="48" y2="-95" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="-15" y="-102" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#475569">Колея W</text>
  </g>

  <line x1="140" y1="60" x2="360" y2="230" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="140" y1="60" x2="312" y2="130" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="140" y1="60" x2="408" y2="130" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>

  <g transform="translate(480, 80)">
    <rect width="250" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="24" font-family="Inter" font-size="13" font-weight="700" fill="#0f172a">Условие Аккермана:</text>
    <rect x="12" y="36" width="226" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="60" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#1e40af">cot δ_out - cot δ_in = W / L</text>

    <text x="14" y="100" font-family="Inter" font-size="11.5" font-weight="700" fill="#0f172a">Эквивалент: модель велосипеда</text>
    <text x="14" y="122" font-family="JetBrains Mono" font-size="11" fill="#0284c7">tan δ = L / R</text>
    <text x="14" y="142" font-family="Inter" font-size="10.5" fill="#475569">• δ — угол виртуального переднего колеса</text>
    <text x="14" y="160" font-family="Inter" font-size="10.5" fill="#475569">• R — радиус поворота задней оси</text>
    <text x="14" y="178" font-family="Inter" font-size="10.5" fill="#475569">• Неголономная связь: dy/dx = tan θ</text>

    <rect x="12" y="195" width="226" height="24" rx="3" fill="#ecfdf5"/>
    <text x="18" y="211" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#059669">v_lateral = ẏ cos θ - ẋ sin θ = 0</text>
  </g>
</svg>