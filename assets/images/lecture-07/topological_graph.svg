<text x="680.0" y="70.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Узел — кадр камеры, запомненный при проезде.</text>
<text x="680.0" y="91.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Ребро — голова расстояния считает,</text>
<text x="680.0" y="112.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">что между кадрами несколько шагов.</text>
<text x="680.0" y="133.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="680.0" y="154.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Глобально: поиск пути по графу</text>
<text x="680.0" y="175.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">(Дейкстра, A* — лекция 02).</text>
<text x="680.0" y="196.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="680.0" y="217.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Локально: диффузионная голова ведёт</text>
<text x="680.0" y="238.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">робота к следующему кадру-подцели.</text>
<text x="680.0" y="259.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="680.0" y="280.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Нет цели в графе: маска m = 1,</text>
<text x="680.0" y="301.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">робот исследует и пополняет граф.</text>
