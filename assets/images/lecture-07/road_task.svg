<text x="506.1" y="225.3" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">медленная машина</text>
<text x="921.6" y="14.7" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">соседняя полоса: тоже движутся</text>
<text x="323.4" y="252.2" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">1. затормозить</text>
<text x="421.6" y="115.9" font-size="14" fill="#059669" text-anchor="end" font-weight="700">2. перестроиться, обогнать, вернуться</text>
