<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 372" width="1100" height="372" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="372" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="28.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">ACT: трансформер предсказывает пакет действий за один проход (Zhao и др., 2023)</text>
<rect x="30.0" y="60.0" width="200.0" height="110.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="130.0" y="86.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Наблюдения</text>
<text x="130.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">4 камеры (кисти, сверху,</text>
<text x="130.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">спереди) + углы</text>
<text x="130.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">суставов двух рук</text>
<line x1="230.0" y1="115.0" x2="280.0" y2="115.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="284.0" y="60.0" width="210.0" height="110.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="389.0" y="86.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Кодировщик</text>
<text x="389.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">ResNet-18 для кадров,</text>
<text x="389.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">трансформер-</text>
<text x="389.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">кодировщик</text>
<line x1="494.0" y1="115.0" x2="544.0" y2="115.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="548.0" y="60.0" width="230.0" height="110.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="663.0" y="86.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">Декодер</text>
<text x="663.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">трансформер: сразу</text>
<text x="663.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">k = 100 будущих</text>
<text x="663.0" y="152.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">действий (≈ 2 с при 50 Гц)</text>
<line x1="778.0" y1="115.0" x2="828.0" y2="115.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="832.0" y="60.0" width="238.0" height="110.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="951.0" y="86.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">Пакет действий</text>
<text x="951.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">углы 14 суставов</text>
<text x="951.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">на 100 тактов вперёд</text>
<rect x="284.0" y="196.0" width="210.0" height="110.0" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="389.0" y="222.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">Стиль z (CVAE)</text>
<text x="389.0" y="246.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">при обучении: сжатие</text>
<text x="389.0" y="267.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">демонстрации; при работе</text>
<text x="389.0" y="288.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">z = 0 (среднее)</text>
<line x1="389.0" y1="196.0" x2="600.0" y2="172.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
<rect x="548.0" y="196.0" width="522.0" height="110.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="564.0" y="230.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Сглаживание по времени (temporal ensembling): пакеты</text>
<text x="564.0" y="250.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">пересчитываются каждый такт, и действие на текущий такт —</text>
<text x="564.0" y="270.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">взвешенное среднее предсказаний из разных пакетов.</text>
<text x="30.0" y="332.0" font-size="13" fill="#475569" text-anchor="start" font-weight="400">Данные: около 50 демонстраций на задачу, собранных телеуправлением на дешёвом стенде ALOHA (две пары рук: ведущая и ведомая).</text>
<text x="30.0" y="352.0" font-size="13" fill="#475569" text-anchor="start" font-weight="400">Отличие от диффузии: один проход сети вместо K шагов очистки; многомодальность — через стиль z, а не через случайный шум.</text>
</svg>
