<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1100" height="300" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<text x="550.0" y="30.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Где применяются методы лекции 07 в системе управления мобильным роботом</text>
<rect x="30.0" y="60.0" width="230.0" height="100.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="145.0" y="86.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Глобальный путь</text>
<text x="145.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">A*, Hybrid A*, RRT*</text>
<text x="145.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">лекции 02–04</text>
<line x1="260.0" y1="110.0" x2="292.0" y2="110.0" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="295.0" y="60.0" width="230.0" height="100.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="410.0" y="86.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="700">Траектория по пути</text>
<text x="410.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">сглаживание и</text>
<text x="410.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">профиль скорости</text>
<line x1="525.0" y1="110.0" x2="557.0" y2="110.0" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="560.0" y="60.0" width="230.0" height="100.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="675.0" y="86.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">Локальный план</text>
<text x="675.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">DWA, MPPI, MPC,</text>
<text x="675.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">решётка Френе</text>
<line x1="790.0" y1="110.0" x2="822.0" y2="110.0" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="825.0" y="60.0" width="230.0" height="100.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="940.0" y="86.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Регуляторы приводов</text>
<text x="940.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">скорости и моменты</text>
<text x="940.0" y="131.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">≈ 1 кГц</text>
<rect x="30.0" y="190.0" width="1040.0" height="90.0" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="48.0" y="216.0" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="700">Обучаемые политики (часть 3 лекции)</text>
<text x="48.0" y="242.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Диффузионная политика или NoMaD заменяет блоки «траектория» и «локальный план»: по изображениям сразу выдаёт</text>
<text x="48.0" y="262.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">последовательность действий на ближайшие секунды. Классические блоки остаются как проверка безопасности.</text>
<text x="345.0" y="182.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">часть 1</text>
<text x="610.0" y="182.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">часть 2</text>
</svg>
