<text x="550.0" y="28.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Прямой процесс: y<tspan baseline-shift="sub" font-size="72%">k</tspan> = √ᾱ<tspan baseline-shift="sub" font-size="72%">k</tspan> · y<tspan baseline-shift="sub" font-size="72%">0</tspan> + √(1 − ᾱ<tspan baseline-shift="sub" font-size="72%">k</tspan>) · ε,  ε ~ N(0, I) — шум добавляется по расписанию</text>
<text x="550.0" y="272.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Обучение: сеть ε<tspan baseline-shift="sub" font-size="72%">θ</tspan>(y<tspan baseline-shift="sub" font-size="72%">k</tspan>, k, o) учится угадывать добавленный шум ε. Это обычная регрессия, но по шуму, а не по действию.</text>
