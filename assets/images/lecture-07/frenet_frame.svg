<text x="591.3" y="204.7" font-size="14" fill="#7c3aed" text-anchor="end" font-weight="700">опорная линия r(s)</text>
<text x="200.4" y="307.3" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">s — длина вдоль линии</text>
<line x1="360.5" y1="182.9" x2="436.1" y2="159.4" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrB)"/>
<text x="442.4" y="175.4" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">t(s)</text>
<line x1="360.5" y1="182.9" x2="329.2" y2="82.1" stroke="#059669" stroke-width="2.6" marker-end="url(#arrG)"/>
<text x="334.8" y="132.5" font-size="18" fill="#059669" text-anchor="end" font-weight="700">d</text>
<circle cx="360.5" cy="182.9" r="6" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<circle cx="329.2" cy="82.1" r="8" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="341.2" y="74.1" font-size="15" fill="#dc2626" text-anchor="start" font-weight="700">робот P</text>
<text x="730.0" y="60.0" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Координаты Френе: (s, d)</text>
<text x="730.0" y="100.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">s — сколько проехано вдоль дороги;</text>
<text x="730.0" y="123.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">d — насколько робот левее (d &gt; 0)</text>
<text x="730.0" y="146.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">или правее (d &lt; 0) опорной линии.</text>
<text x="730.0" y="169.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="730.0" y="192.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Переход обратно в (x, y):</text>
<text x="730.0" y="215.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">  P = r(s) + d · n(s),</text>
<text x="730.0" y="238.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">  n(s) — единичная нормаль к линии.</text>
<text x="730.0" y="261.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400"></text>
<text x="730.0" y="284.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Прямая и извилистая дорога</text>
<text x="730.0" y="307.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">в координатах (s, d) выглядят</text>
<text x="730.0" y="330.0" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">одинаково: полоса — это d ≈ const.</text>
</svg>
