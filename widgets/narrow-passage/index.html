<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Узкие проходы и эвристики сэмплинга</title>
  <link rel="stylesheet" href="../common/widget-base.css"
        onerror="this.onerror=null; this.href='common/widget-base.css';">
</head>
<body>
  <div class="widget-layout">
    <div class="toolbar">
      <select id="strategySelect" class="select-control">
        <option value="uniform">Равномерный сэмплинг (Uniform)</option>
        <option value="bridge">Bridge Test (Мостовой тест)</option>
        <option value="gaussian">Gaussian Sampling (Вдоль границ)</option>
      </select>

      <button id="btnStep" class="btn">▶ Шаг (+15 точек)</button>
      <button id="btnRun" class="btn btn-primary">⚡ Запуск (+150)</button>
      <button id="btnPlan" class="btn btn-success">🎯 Соединить (RRT)</button>
      <button id="btnReset" class="btn">🔄 Сброс</button>

      <div class="slider-group">
        <span>Ширина щели:</span>
        <input type="range" id="gapSlider" min="12" max="60" value="22">
        <span id="gapVal">22 px</span>
      </div>

      <div class="slider-group">
        <span>Шаг теста / σ:</span>
        <input type="range" id="sigmaSlider" min="15" max="60" value="32">
        <span id="sigmaVal">32 px</span>
      </div>

      <div class="stats-bar">
        <div class="stat-item">Попыток: <span id="statAttempts">0</span></div>
        <div class="stat-item">В щели: <span id="statInGap">0</span></div>
        <div class="stat-item">Успех: <span id="statRatio">0%</span></div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="passageCanvas"></canvas>
      <div class="overlay-hint">Сравните: равномерный сэмплинг почти не попадает в щель. Bridge Test генерирует точки строго внутри узкого прохода!</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('passageCanvas');
    const ctx = canvas.getContext('2d');

    let width = 800;
    let height = 500;

    let start = { x: 100, y: 250 };
    let goal = { x: 700, y: 250 };

    let acceptedSamples = [];
    let debugPairs = []; // { p1, p2, mid, accepted }
    let treeNodes = [];
    let pathFound = null;

    let attemptsCount = 0;
    let inGapCount = 0;

    function getObstacles() {
      const gap = Number(document.getElementById('gapSlider').value);
      const wallX = width * 0.5 - 30;
      const wallW = 60;
      const midY = height * 0.5;

      // Two giant vertical blocks forming a narrow passage in the middle
      return [
        { x: wallX, y: 0, w: wallW, h: midY - gap / 2 },
        { x: wallX, y: midY + gap / 2, w: wallW, h: height - (midY + gap / 2) }
      ];
    }

    function isInsideObstacle(p) {
      const obs = getObstacles();
      for (const b of obs) {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          return true;
        }
      }
      return false;
    }

    function isInGapZone(p) {
      const gap = Number(document.getElementById('gapSlider').value);
      const wallX = width * 0.5 - 30;
      const wallW = 60;
      const midY = height * 0.5;
      return (p.x >= wallX && p.x <= wallX + wallW && p.y >= midY - gap / 2 && p.y <= midY + gap / 2);
    }

    function resize() {
      const container = canvas.parentElement;
      if (!container) return;
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;

      start = { x: width * 0.15, y: height * 0.5 };
      goal = { x: width * 0.85, y: height * 0.5 };
      draw();
    }

    function autosize(element, onResize) {
      if (!element) return;
      let frames = 0;
      let ticks = 0;
      let poll = null;

      function sized() {
        return element.clientWidth > 0 && element.clientHeight > 0;
      }

      function attempt() {
        onResize();
        if (sized()) return;
        if (frames++ < 240) {
          window.requestAnimationFrame(attempt);
        } else if (!poll) {
          poll = setInterval(function () {
            onResize();
            if (sized() || ticks++ > 40) {
              clearInterval(poll);
              poll = null;
            }
          }, 250);
        }
      }

      window.requestAnimationFrame(attempt);
      window.addEventListener('resize', onResize);
      window.addEventListener('pageshow', onResize);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) onResize();
      });
      if (window.ResizeObserver) new window.ResizeObserver(onResize).observe(element);
    }

    autosize(canvas.parentElement, resize);

    function sampleBatch(count) {
      const strat = document.getElementById('strategySelect').value;
      const sigma = Number(document.getElementById('sigmaSlider').value);
      debugPairs = [];

      for (let i = 0; i < count; i++) {
        attemptsCount++;

        if (strat === 'uniform') {
          const pt = { x: Math.random() * width, y: Math.random() * height };
          if (!isInsideObstacle(pt)) {
            acceptedSamples.push(pt);
            if (isInGapZone(pt)) inGapCount++;
          }
        } else if (strat === 'bridge') {
          // Bridge Test:
          // 1. Pick p1 in C_obs
          const p1 = { x: Math.random() * width, y: Math.random() * height };
          if (!isInsideObstacle(p1)) continue;

          // 2. Step in random direction by d ~ Normal(0, sigma)
          const angle = Math.random() * Math.PI * 2;
          const d = sigma * (0.8 + Math.random() * 0.5);
          const p2 = { x: p1.x + Math.cos(angle) * d, y: p1.y + Math.sin(angle) * d };

          // 3. If p2 is also in C_obs
          if (isInsideObstacle(p2)) {
            const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
            // 4. If midpoint is FREE!
            if (!isInsideObstacle(mid) && mid.x >= 0 && mid.x <= width && mid.y >= 0 && mid.y <= height) {
              acceptedSamples.push(mid);
              if (isInGapZone(mid)) inGapCount++;
              if (debugPairs.length < 15) {
                debugPairs.push({ p1, p2, mid, accepted: true });
              }
            }
          }
        } else if (strat === 'gaussian') {
          // Gaussian Sampling:
          const p1 = { x: Math.random() * width, y: Math.random() * height };
          const angle = Math.random() * Math.PI * 2;
          const r = Math.abs((Math.random() + Math.random() - 1) * sigma * 1.5);
          const p2 = { x: p1.x + Math.cos(angle) * r, y: p1.y + Math.sin(angle) * r };

          const c1 = isInsideObstacle(p1);
          const c2 = isInsideObstacle(p2);

          // Keep sample if one is obstacle and other is free
          if (c1 !== c2) {
            const freePt = c1 ? p2 : p1;
            if (freePt.x >= 0 && freePt.x <= width && freePt.y >= 0 && freePt.y <= height) {
              acceptedSamples.push(freePt);
              if (isInGapZone(freePt)) inGapCount++;
            }
          }
        }
      }

      updateStats();
      draw();
    }

    function runPlanning() {
      // Connect Start to Goal using accepted samples via RRT / PRM
      treeNodes = [{ x: start.x, y: start.y, parent: null }];
      pathFound = null;

      function dist(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
      }

      function isSegmentClear(a, b) {
        const d = dist(a, b);
        const steps = Math.max(3, Math.ceil(d / 4));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const pt = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
          if (isInsideObstacle(pt)) return false;
        }
        return true;
      }

      // Build target pool: goal + accepted samples
      const pool = [...acceptedSamples, goal];

      for (let iter = 0; iter < 400; iter++) {
        const target = pool[Math.floor(Math.random() * pool.length)];
        // Nearest in tree
        let best = treeNodes[0];
        let minD = dist(treeNodes[0], target);
        for (let j = 1; j < treeNodes.length; j++) {
          const d = dist(treeNodes[j], target);
          if (d < minD) {
            minD = d;
            best = treeNodes[j];
          }
        }

        const d = dist(best, target);
        const step = Math.min(26, d);
        const theta = Math.atan2(target.y - best.y, target.x - best.x);
        const newNode = {
          x: best.x + Math.cos(theta) * step,
          y: best.y + Math.sin(theta) * step,
          parent: best
        };

        if (isSegmentClear(best, newNode)) {
          treeNodes.push(newNode);
          if (dist(newNode, goal) < 28 && isSegmentClear(newNode, goal)) {
            const goalNode = { x: goal.x, y: goal.y, parent: newNode };
            treeNodes.push(goalNode);
            // Reconstruct path
            pathFound = [];
            let curr = goalNode;
            while (curr) {
              pathFound.push(curr);
              curr = curr.parent;
            }
            break;
          }
        }
      }

      draw();
    }

    function resetAll() {
      acceptedSamples = [];
      debugPairs = [];
      treeNodes = [];
      pathFound = null;
      attemptsCount = 0;
      inGapCount = 0;
      updateStats();
      draw();
    }

    function updateStats() {
      document.getElementById('statAttempts').textContent = attemptsCount;
      document.getElementById('statInGap').textContent = inGapCount;
      const ratio = attemptsCount > 0 ? ((inGapCount / attemptsCount) * 100).toFixed(1) : 0;
      document.getElementById('statRatio').textContent = ratio + '%';
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw obstacles
      const obs = getObstacles();
      ctx.fillStyle = '#cbd5e1';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      for (const b of obs) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }

      // 2. Draw gap guide lines
      const gap = Number(document.getElementById('gapSlider').value);
      const wallX = width * 0.5 - 30;
      const wallW = 60;
      const midY = height * 0.5;
      ctx.strokeStyle = 'rgba(5, 150, 105, 0.4)';
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(wallX, midY - gap / 2, wallW, gap);
      ctx.setLineDash([]);

      ctx.fillStyle = '#059669';
      ctx.font = '10.5px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Узкий проход (' + gap + ' px)', wallX + wallW / 2, midY + gap / 2 + 16);

      // 3. Draw debug pairs for Bridge Test
      for (const pair of debugPairs) {
        ctx.beginPath();
        ctx.moveTo(pair.p1.x, pair.p1.y);
        ctx.lineTo(pair.p2.x, pair.p2.y);
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(pair.p1.x, pair.p1.y, 3, 0, Math.PI * 2);
        ctx.arc(pair.p2.x, pair.p2.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
      }

      // 4. Draw accepted samples
      for (const pt of acceptedSamples) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2);
        if (isInGapZone(pt)) {
          ctx.fillStyle = '#059669'; // Highlight points in gap in green!
        } else {
          ctx.fillStyle = '#0284c7';
        }
        ctx.fill();
      }

      // 5. Draw planning tree if active
      if (treeNodes.length > 1) {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)';
        ctx.lineWidth = 1.2;
        for (let i = 1; i < treeNodes.length; i++) {
          const n = treeNodes[i];
          if (n.parent) {
            ctx.beginPath();
            ctx.moveTo(n.parent.x, n.parent.y);
            ctx.lineTo(n.x, n.y);
            ctx.stroke();
          }
        }
      }

      // 6. Draw path found
      if (pathFound && pathFound.length > 1) {
        ctx.beginPath();
        ctx.moveTo(pathFound[0].x, pathFound[0].y);
        for (let i = 1; i < pathFound.length; i++) {
          ctx.lineTo(pathFound[i].x, pathFound[i].y);
        }
        ctx.strokeStyle = '#059669';
        ctx.lineWidth = 4;
        ctx.stroke();

        for (const pt of pathFound) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#059669';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      // 7. Start and Goal
      ctx.beginPath();
      ctx.arc(start.x, start.y, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#10b981';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', start.x, start.y);

      ctx.beginPath();
      ctx.arc(goal.x, goal.y, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('G', goal.x, goal.y);
    }

    document.getElementById('gapSlider').addEventListener('input', (e) => {
      document.getElementById('gapVal').textContent = e.target.value + ' px';
      draw();
    });
    document.getElementById('sigmaSlider').addEventListener('input', (e) => {
      document.getElementById('sigmaVal').textContent = e.target.value + ' px';
    });

    document.getElementById('btnStep').addEventListener('click', () => sampleBatch(15));
    document.getElementById('btnRun').addEventListener('click', () => sampleBatch(150));
    document.getElementById('btnPlan').addEventListener('click', runPlanning);
    document.getElementById('btnReset').addEventListener('click', resetAll);
    document.getElementById('strategySelect').addEventListener('change', resetAll);

    setTimeout(() => {
      sampleBatch(50);
    }, 150);
  </script>
</body>
</html>
