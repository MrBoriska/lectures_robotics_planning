<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диффузия и регрессия: генерация траектории объезда</title>
<link rel="stylesheet" href="../common/widget-base.css">
<style>
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr); gap: 8px; padding: 8px; }
  .panel { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; min-height: 0; }
  .ptitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .cv { flex: 1; min-height: 0; position: relative; }
  .col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .ctrls { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: 11.5px; }
  .ctrls input[type=range] { width: 100%; accent-color: #0284c7; }
  .ctrls .v { font-family: var(--font-mono); color: var(--accent-blue); font-weight: 600; min-width: 42px; text-align: right; }
  .note { font-size: 12px; line-height: 1.38; color: #1e293b; background: #f0f9ff; border-left: 3px solid #0284c7; padding: 6px 9px; border-radius: 4px; }
  .note b { color: #0c4a6e; }
  table.res { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.res td { padding: 2px 6px; border-bottom: 1px solid #eef2f7; }
  table.res td:last-child { text-align: right; font-family: var(--font-mono); }
  .checks { display: flex; gap: 12px; font-size: 11.5px; flex-wrap: wrap; }
  .checks label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
</style>
</head>
<body>
<div class="widget-layout">
  <div class="toolbar">
    <b style="color: var(--accent-blue);">Модель:</b>
    <select id="model" class="select-control">
      <option value="mse">регрессия (MSE)</option>
      <option value="ddpm" selected>диффузия (DDPM)</option>
      <option value="flow">согласование потоков (Flow Matching)</option>
    </select>
    <button id="gen" class="btn btn-primary">Сгенерировать</button>
    <button id="step" class="btn">Один шаг</button>
    <button id="noise" class="btn">Новый шум</button>
    <div class="checks" style="margin-left: 6px;">
      <label><input type="checkbox" id="showDemos" checked>демонстрации</label>
      <label><input type="checkbox" id="guide">учитывать новое препятствие</label>
    </div>
    <span id="stepInfo" style="margin-left:auto; font-family: var(--font-mono); font-size: 12px; color:#0369a1;"></span>
  </div>
  <div class="main">
    <div class="col">
      <div class="panel" style="flex: 1;">
        <div class="ptitle"><span>Сцена (жёлтое препятствие можно перетащить)</span><span><span style="color:#64748b">серые — демонстрации</span>, <span style="color:#059669">зелёные — без касаний</span>, <span style="color:#dc2626">красные — задевают</span></span></div>
        <div class="cv"><canvas id="arena"></canvas></div>
      </div>
      <div class="panel" style="flex: 0 0 auto;"><div class="note" id="note"></div></div>
    </div>
    <div class="col">
      <div class="panel" style="flex: 1;">
        <div class="ptitle"><span>Смещение средней точки</span><span>кривая — данные, точки — выборки</span></div>
        <div class="cv"><canvas id="hist"></canvas></div>
      </div>
      <div class="panel" style="flex: 0 0 auto; gap: 6px;">
        <div class="ctrls">
          <span>Доля объездов слева в данных</span><input type="range" id="wL" min="0" max="1" step="0.05"><span class="v" id="wLv"></span>
          <span>Число шагов K</span><input type="range" id="K" min="1" max="50" step="1"><span class="v" id="Kv"></span>
          <span>Число выборок</span><input type="range" id="N" min="1" max="24" step="1"><span class="v" id="Nv"></span>
          <span>Сила учёта препятствия λ</span><input type="range" id="lam" min="0" max="20" step="0.5"><span class="v" id="lamv"></span>
        </div>
        <table class="res"><tbody id="stats"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
// ---------------------------------------------------------------------------
// Что моделируется.
// Траектория — M = 14 промежуточных точек между стартом и целью; переменная y ∈ R^M —
// поперечные смещения точек. Демонстрации (данные) распределены как смесь двух
// гауссиан: объезд слева N(μ_L, Σ) с весом w_L и справа N(μ_R, Σ) с весом 1 − w_L;
// Σ — гладкая ковариация (соседние точки сдвигаются согласованно).
//
// Обученная нейросеть в диффузионной политике приближает функцию оценки
// (score) ∇_y log p_k(y) зашумлённого распределения. Для смеси гауссиан эта функция
// известна точно, поэтому здесь используется «идеально обученная сеть»: все
// эффекты (два режима, роль числа шагов) — свойства самих алгоритмов, а не ошибок обучения.
//
// Регрессия (MSE): ответ — условное среднее, w_L μ_L + (1 − w_L) μ_R.
// DDPM: y_K ~ N(0, I); шаг y_{k−1} = (y_k − β_k/√(1−ᾱ_k) ε̂)/√α_k + σ_k z,
//   ε̂ = −√(1−ᾱ_k) ∇log p_k(y_k); косинусное расписание шума.
// Flow Matching: x_τ = (1−τ)x_0 + τx_1, x_0 ~ N(0, I); поле скоростей
//   v(x, τ) = (E[x_1 | x_τ = x] − x)/(1 − τ) (точно для смеси гауссиан); метод Эйлера.
// Учёт нового препятствия (guidance): к функции оценки (или к скорости) добавляется
//   −λ∇c, где c — штраф за проникновение точек траектории в новое препятствие,
//   вычисленный по текущей оценке чистой траектории.
// ---------------------------------------------------------------------------
const M = 14, A = 1.55, SIG = 0.22, ELL = 2.5;
const START = [-4.5, 0], GOAL = [4.5, 0], OBST = { x: 0, y: 0, r: 0.9 };
let NEWOBS = { x: 2.2, y: 1.3, r: 0.55 };
const XS = Array.from({ length: M }, (_, j) => START[0] + (j + 1) / (M + 1) * (GOAL[0] - START[0]));
const MU_L = XS.map((_, j) => A * Math.sin(Math.PI * (j + 1) / (M + 1)));
const MU_R = MU_L.map(v => -v);
const MID = Math.floor(M / 2) - 1; // средняя точка

// ковариация Σ и её собственное разложение (метод Якоби)
const SIGMA = [];
for (let i = 0; i < M; i++) { SIGMA.push([]); for (let j = 0; j < M; j++) SIGMA[i].push(SIG * SIG * Math.exp(-((i - j) ** 2) / (2 * ELL * ELL)) + (i === j ? 1e-4 : 0)); }
function jacobi(S) {
  const n = S.length, a = S.map(r => r.slice()), V = S.map((_, i) => S.map((_, j) => (i === j ? 1 : 0)));
  for (let sweep = 0; sweep < 60; sweep++) {
    let off = 0; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) off += a[i][j] ** 2;
    if (off < 1e-18) break;
    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {
      if (Math.abs(a[p][q]) < 1e-15) continue;
      const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);
      const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)), c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < n; k++) { const akp = a[k][p], akq = a[k][q]; a[k][p] = c * akp - s * akq; a[k][q] = s * akp + c * akq; }
      for (let k = 0; k < n; k++) { const apk = a[p][k], aqk = a[q][k]; a[p][k] = c * apk - s * aqk; a[q][k] = s * apk + c * aqk; }
      for (let k = 0; k < n; k++) { const vkp = V[k][p], vkq = V[k][q]; V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq; }
    }
  }
  return { lam: a.map((r, i) => r[i]), U: V };
}
const EIG = jacobi(SIGMA);
const toE = y => EIG.U[0].map((_, k) => y.reduce((acc, yi, i) => acc + EIG.U[i][k] * yi, 0)); // U^T y
const fromE = z => EIG.U.map(row => row.reduce((acc, u, k) => acc + u * z[k], 0));          // U z

// случайные числа с зерном
let seed = 12345;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
const gauss = () => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const sampleData = left => { const z = EIG.lam.map(l => Math.sqrt(Math.max(0, l)) * gauss()); const e = fromE(z); return e.map((v, i) => v + (left ? MU_L[i] : MU_R[i])); };

// ---------------------------------------------------------------- точные функции
// Для компоненты c при «ковариации» C = a·Σ + b·I и среднем m:
// C^{-1}(y − m) = U diag(1/(a λ + b)) U^T (y − m), квадратичная форма q = Σ (U^T(y−m))_k² / (aλ_k + b).
function compTerms(y, mean, a, b) {
  const e = toE(y.map((v, i) => v - mean[i]));
  let q = 0; const w = e.map((ek, k) => { const d = a * EIG.lam[k] + b; q += ek * ek / d; return ek / d; });
  return { q, cinv: fromE(w), e };
}
function posterior(qL, qR) {
  const wL = st.wL, wR = 1 - st.wL;
  const lL = wL > 0 ? Math.log(wL) - 0.5 * qL : -Infinity, lR = wR > 0 ? Math.log(wR) - 0.5 * qR : -Infinity;
  const mx = Math.max(lL, lR), eL = Math.exp(lL - mx), eR = Math.exp(lR - mx);
  return [eL / (eL + eR), eR / (eL + eR)];
}
// функция оценки зашумлённого распределения DDPM при уровне ᾱ
function score(y, ab) {
  const s = Math.sqrt(ab);
  const L = compTerms(y, MU_L.map(v => s * v), ab, 1 - ab), R = compTerms(y, MU_R.map(v => s * v), ab, 1 - ab);
  const [rL, rR] = posterior(L.q, R.q);
  return y.map((_, i) => -(rL * L.cinv[i] + rR * R.cinv[i]));
}
// поле скоростей Flow Matching
function velocity(x, tau) {
  const a = tau * tau, b = (1 - tau) ** 2;
  const L = compTerms(x, MU_L.map(v => tau * v), a, b), R = compTerms(x, MU_R.map(v => tau * v), a, b);
  const [rL, rR] = posterior(L.q, R.q);
  // E[x1 | x, c] = μ_c + τ Σ C^{-1}(x − τ μ_c)
  const SL = SIGMA.map(row => row.reduce((acc, sij, j) => acc + sij * L.cinv[j], 0));
  const SR = SIGMA.map(row => row.reduce((acc, sij, j) => acc + sij * R.cinv[j], 0));
  const ex1 = x.map((_, i) => rL * (MU_L[i] + tau * SL[i]) + rR * (MU_R[i] + tau * SR[i]));
  return x.map((xi, i) => (ex1[i] - xi) / (1 - tau));
}
// штраф за новое препятствие и его градиент по смещениям
function guidanceGrad(y) {
  const g = y.map(() => 0); let c = 0;
  for (let i = 0; i < M; i++) {
    const dx = XS[i] - NEWOBS.x, dy = y[i] - NEWOBS.y, d = Math.hypot(dx, dy) + 1e-9, pen = NEWOBS.r + 0.35 - d;
    if (pen > 0) { c += pen * pen; g[i] = -2 * pen * dy / d; }
  }
  return { c, g };
}

// ---------------------------------------------------------------- расписание
const abar = (k, K) => { const t = k / K; const f = x => Math.cos((x + 0.008) / 1.008 * Math.PI / 2) ** 2; return Math.min(0.9999, Math.max(1e-4, f(t) / f(0))); };

// ---------------------------------------------------------------- состояние
let st = { wL: 0.5, K: 20, N: 12, lam: 6, model: 'ddpm' };
let samples = [], z0 = [], stepIdx = 0, demos = [], timer = null;

function makeDemos() { seed = 777; demos = []; for (let i = 0; i < 30; i++) demos.push(sampleData(rnd() < st.wL)); }
function newNoise() { seed = (Date.now() & 0xffff) + 1; z0 = []; for (let n = 0; n < 24; n++) z0.push(XS.map(() => gauss())); reset(); }
function reset() {
  stepIdx = 0;
  samples = st.model === 'mse' ? [] : z0.slice(0, st.N).map(z => z.slice());
  if (st.model === 'mse') { const m = MU_L.map((v, i) => st.wL * v + (1 - st.wL) * MU_R[i]); samples = [m]; stepIdx = st.K; }
  stopAnim(); draw();
}
function stepOnce() {
  if (st.model === 'mse' || stepIdx >= st.K) return;
  const K = st.K, k = K - stepIdx; // текущий уровень шума k → k−1
  const guide = $('guide').checked;
  if (st.model === 'ddpm') {
    const ab = abar(k, K), abPrev = k - 1 > 0 ? abar(k - 1, K) : 1, alpha = ab / abPrev, beta = 1 - alpha;
    samples = samples.map(y => {
      let sc = score(y, ab);
      if (guide) {
        const eps0 = sc.map(v => -Math.sqrt(1 - ab) * v);
        const y0 = y.map((v, i) => (v - Math.sqrt(1 - ab) * eps0[i]) / Math.sqrt(ab));
        const { g } = guidanceGrad(y0);
        sc = sc.map((v, i) => v - st.lam * g[i]);
      }
      const eps = sc.map(v => -Math.sqrt(1 - ab) * v);
      const mean = y.map((v, i) => (v - beta / Math.sqrt(1 - ab) * eps[i]) / Math.sqrt(alpha));
      if (k - 1 === 0) return mean;
      const sig = Math.sqrt((1 - abPrev) / (1 - ab) * beta);
      return mean.map(v => v + sig * gauss());
    });
  } else {
    const tau = stepIdx / K, h = 1 / K;
    samples = samples.map(x => {
      let v = velocity(x, tau);
      if (guide) {
        const x1 = x.map((xi, i) => xi + (1 - tau) * v[i]);
        const { g } = guidanceGrad(x1);
        v = v.map((vi, i) => vi - st.lam * 0.15 * g[i]);
      }
      return x.map((xi, i) => xi + h * v[i]);
    });
  }
  stepIdx++;
}
function stopAnim() { if (timer) { clearInterval(timer); timer = null; } }

// ---------------------------------------------------------------- метрики
function pathPts(y) { return [START, ...XS.map((x, i) => [x, y[i]]), GOAL]; }
function hits(y, o) {
  const P = pathPts(y);
  for (let i = 0; i < P.length - 1; i++) for (let k = 0; k <= 8; k++) {
    const x = P[i][0] + (P[i + 1][0] - P[i][0]) * k / 8, yy = P[i][1] + (P[i + 1][1] - P[i][1]) * k / 8;
    if (Math.hypot(x - o.x, yy - o.y) < o.r) return true;
  }
  return false;
}

// ---------------------------------------------------------------- рисование
const $ = id => document.getElementById(id);
function fit(cv) {
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(10, r.width * dpr); cv.height = Math.max(10, r.height * dpr);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, r.width, r.height];
}
let arenaMap = null;
function drawArena() {
  const [ctx, W, H] = fit($('arena'));
  ctx.clearRect(0, 0, W, H);
  const sc = Math.min(W / 10.5, H / 6.4), px = x => W / 2 + x * sc, py = y => H / 2 - y * sc;
  arenaMap = { sc, W, H };
  ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 1;
  for (let x = -5; x <= 5; x++) { ctx.beginPath(); ctx.moveTo(px(x), py(-3.2)); ctx.lineTo(px(x), py(3.2)); ctx.stroke(); }
  for (let y = -3; y <= 3; y++) { ctx.beginPath(); ctx.moveTo(px(-5.2), py(y)); ctx.lineTo(px(5.2), py(y)); ctx.stroke(); }
  // препятствия
  ctx.fillStyle = '#fee2e2'; ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px(OBST.x), py(OBST.y), OBST.r * sc, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b91c1c'; ctx.font = '600 11px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('препятствие', px(0), py(0) + 4);
  ctx.fillStyle = 'rgba(253,230,138,0.8)'; ctx.strokeStyle = '#d97706';
  ctx.beginPath(); ctx.arc(px(NEWOBS.x), py(NEWOBS.y), NEWOBS.r * sc, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#92400e'; ctx.fillText('новое', px(NEWOBS.x), py(NEWOBS.y) + 4);
  const drawPath = (y, col, w) => { const P = pathPts(y); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(px(p[0]), py(p[1])) : ctx.moveTo(px(p[0]), py(p[1]))); ctx.stroke(); };
  if ($('showDemos').checked) for (const d of demos) drawPath(d, 'rgba(100,116,139,0.28)', 1.2);
  const done = stepIdx >= st.K;
  for (const y of samples) {
    const bad = hits(y, OBST) || hits(y, NEWOBS);
    const col = st.model === 'mse' ? '#dc2626' : !done ? 'rgba(37,99,235,0.55)' : bad ? '#dc2626' : '#059669';
    drawPath(y, col, st.model === 'mse' ? 3.2 : 1.8);
    ctx.fillStyle = col; for (let i = 0; i < M; i++) { ctx.beginPath(); ctx.arc(px(XS[i]), py(y[i]), 2.2, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(px(START[0]), py(START[1]), 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#059669'; ctx.beginPath(); ctx.arc(px(GOAL[0]), py(GOAL[1]), 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#334155'; ctx.font = '11px Inter, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('старт', px(START[0]) - 14, py(START[1]) + 20); ctx.textAlign = 'right'; ctx.fillText('цель', px(GOAL[0]) + 14, py(GOAL[1]) + 20);
}
function drawHist() {
  const [ctx, W, H] = fit($('hist'));
  ctx.clearRect(0, 0, W, H);
  const X0 = 30, Y0 = 8, Wb = W - 40, Hb = H - 34, lo = -3.2, hi = 3.2;
  const px = v => X0 + (v - lo) / (hi - lo) * Wb;
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(X0, Y0, Wb, Hb); ctx.strokeStyle = '#cbd5e1'; ctx.strokeRect(X0, Y0, Wb, Hb);
  // плотность данных в средней точке и (при ᾱ < 1) — зашумлённая плотность
  const sd = Math.sqrt(SIGMA[MID][MID]);
  const dens = (v, s2, mL, mR) => st.wL * Math.exp(-((v - mL) ** 2) / (2 * s2)) / Math.sqrt(2 * Math.PI * s2) + (1 - st.wL) * Math.exp(-((v - mR) ** 2) / (2 * s2)) / Math.sqrt(2 * Math.PI * s2);
  const curve = (s2, mL, mR, col, w, fill) => {
    let mx = 0; const pts = [];
    for (let i = 0; i <= 200; i++) { const v = lo + (hi - lo) * i / 200; const d = dens(v, s2, mL, mR); pts.push([v, d]); mx = Math.max(mx, d); }
    return { pts, mx, col, w, fill };
  };
  const data = curve(sd * sd, MU_L[MID], MU_R[MID], '#059669', 2.4, 'rgba(16,185,129,0.12)');
  const curves = [data];
  if (st.model !== 'mse' && stepIdx < st.K) {
    const K = st.K, k = K - stepIdx;
    if (st.model === 'ddpm') { const ab = abar(k, K); curves.push(curve(ab * sd * sd + 1 - ab, Math.sqrt(ab) * MU_L[MID], Math.sqrt(ab) * MU_R[MID], '#2563eb', 1.8, null)); }
    else { const t = stepIdx / K; curves.push(curve(t * t * sd * sd + (1 - t) ** 2, t * MU_L[MID], t * MU_R[MID], '#2563eb', 1.8, null)); }
  }
  const ymax = Math.max(...curves.map(c => c.mx)) * 1.15;
  const py = d => Y0 + Hb - d / ymax * Hb;
  for (const c of curves) {
    ctx.beginPath(); c.pts.forEach(([v, d], i) => i ? ctx.lineTo(px(v), py(d)) : ctx.moveTo(px(v), py(d)));
    if (c.fill) { ctx.lineTo(px(hi), py(0)); ctx.lineTo(px(lo), py(0)); ctx.closePath(); ctx.fillStyle = c.fill; ctx.fill(); ctx.beginPath(); c.pts.forEach(([v, d], i) => i ? ctx.lineTo(px(v), py(d)) : ctx.moveTo(px(v), py(d))); }
    ctx.strokeStyle = c.col; ctx.lineWidth = c.w; ctx.stroke();
  }
  // препятствие на оси
  ctx.fillStyle = 'rgba(220,38,38,0.12)'; ctx.fillRect(px(-OBST.r), Y0, px(OBST.r) - px(-OBST.r), Hb);
  // выборки
  samples.forEach((y, n) => { ctx.fillStyle = st.model === 'mse' ? '#dc2626' : '#1d4ed8'; ctx.beginPath(); ctx.arc(px(Math.max(lo, Math.min(hi, y[MID]))), Y0 + Hb - 8 - (n % 4) * 7, 3.5, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#64748b'; ctx.font = '10.5px Inter, sans-serif'; ctx.textAlign = 'center';
  for (const v of [-3, -2, -1, 0, 1, 2, 3]) ctx.fillText(v, px(v), Y0 + Hb + 12);
  ctx.textAlign = 'right'; ctx.font = 'italic 11px Inter, sans-serif'; ctx.fillText('смещение y, м (справа ← 0 → слева)', X0 + Wb, Y0 + Hb + 25);
  ctx.textAlign = 'left'; ctx.font = '10.5px Inter, sans-serif';
  ctx.fillStyle = '#059669'; ctx.fillText('данные', X0 + 6, Y0 + 14);
  if (curves.length > 1) { ctx.fillStyle = '#2563eb'; ctx.fillText('зашумлённые данные на текущем шаге', X0 + 6, Y0 + 28); }
  ctx.fillStyle = '#b91c1c'; ctx.textAlign = 'center'; ctx.fillText('препятствие', px(0), Y0 + 14);
}
function renderStats() {
  const done = stepIdx >= st.K || st.model === 'mse';
  let col = 0, colNew = 0, left = 0;
  for (const y of samples) { if (hits(y, OBST)) col++; if (hits(y, NEWOBS)) colNew++; if (y[MID] > 0) left++; }
  const n = samples.length;
  const rows = [
    ['выборок', n],
    ['слева / справа', done ? `${left} / ${n - left}` : '—'],
    ['задевают препятствие', done ? `${col} из ${n}` : '—'],
    ['задевают новое препятствие', done ? `${colNew} из ${n}` : '—'],
    ['вычислений сети на выборку', st.model === 'mse' ? 1 : st.K],
  ];
  $('stats').innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  if (st.model === 'mse') $('stepInfo').textContent = 'один проход сети';
  else if (st.model === 'ddpm') { const k = st.K - stepIdx; $('stepInfo').textContent = `шаг ${stepIdx}/${st.K}, уровень шума √(1−ᾱ) = ${k > 0 ? Math.sqrt(1 - abar(k, st.K)).toFixed(2) : '0.00'}`; }
  else $('stepInfo').textContent = `шаг ${stepIdx}/${st.K}, τ = ${(stepIdx / st.K).toFixed(2)}`;
}
const NOTES = {
  mse: '<b>Регрессия.</b> Сеть, обученная по среднеквадратичной ошибке, выдаёт <b>среднее</b> всех демонстраций для этой сцены. Половина людей объезжала слева, половина справа — среднее идёт прямо в препятствие. Сдвиньте долю объездов слева к 0.8: среднее сместится, но всё ещё может задевать препятствие.',
  ddpm: '<b>Диффузия.</b> Выборки начинаются с чистого шума и за K шагов «очищаются». Каждая попадает в один из двух вариантов объезда, а не в среднее. Правая панель: синяя кривая — распределение на текущем шаге, оно постепенно превращается в два горба данных. Уменьшите K до 2–3: выборки становятся неаккуратными. Включите «учитывать новое препятствие»: траектории отгибаются от жёлтого круга, которого не было в данных.',
  flow: '<b>Согласование потоков.</b> Выборки движутся от шума к данным по полю скоростей (интегрирование ОДУ методом Эйлера). При K = 1 один шаг из шума даёт ровно среднее, как у регрессии; уже при K = 4–8 выборки разделяются на два варианта. Сравните с диффузией при том же K: потоку нужно меньше шагов.',
};

function draw() { drawArena(); drawHist(); renderStats(); }

// ---------------------------------------------------------------- управление
function setSliders() {
  $('wL').value = st.wL; $('K').value = st.K; $('N').value = st.N; $('lam').value = st.lam;
  $('wLv').textContent = st.wL.toFixed(2); $('Kv').textContent = st.K; $('Nv').textContent = st.N; $('lamv').textContent = st.lam.toFixed(1);
}
$('model').addEventListener('change', () => { st.model = $('model').value; $('note').innerHTML = NOTES[st.model]; reset(); });
$('wL').addEventListener('input', () => { st.wL = +$('wL').value; setSliders(); makeDemos(); reset(); });
for (const id of ['K', 'N', 'lam']) $(id).addEventListener('input', () => { st[id] = +$(id).value; setSliders(); reset(); });
$('showDemos').addEventListener('change', draw);
$('guide').addEventListener('change', reset);
$('noise').addEventListener('click', newNoise);
$('step').addEventListener('click', () => { stopAnim(); if (stepIdx >= st.K) reset(); else { stepOnce(); draw(); } });
$('gen').addEventListener('click', () => {
  reset(); if (st.model === 'mse') return;
  const dt = Math.max(30, Math.min(220, 2400 / st.K));
  timer = setInterval(() => { stepOnce(); draw(); if (stepIdx >= st.K) stopAnim(); }, dt);
});
// перетаскивание нового препятствия
let drag = false;
const toWorld = e => { const r = $('arena').getBoundingClientRect(); return [(e.clientX - r.left - arenaMap.W / 2) / arenaMap.sc, -(e.clientY - r.top - arenaMap.H / 2) / arenaMap.sc]; };
$('arena').addEventListener('mousedown', e => { const [x, y] = toWorld(e); if (Math.hypot(x - NEWOBS.x, y - NEWOBS.y) < NEWOBS.r + 0.2) drag = true; });
window.addEventListener('mouseup', () => { if (drag) { drag = false; reset(); } });
$('arena').addEventListener('mousemove', e => { if (!drag) return; const [x, y] = toWorld(e); NEWOBS.x = Math.max(-3.5, Math.min(3.5, x)); NEWOBS.y = Math.max(-2.8, Math.min(2.8, y)); drawArena(); });
window.addEventListener('resize', draw);
if (window.ResizeObserver) new ResizeObserver(() => draw()).observe(document.body);

const params = new URLSearchParams(location.search);
if (params.get('model')) { st.model = params.get('model'); $('model').value = st.model; }
if (params.get('K')) st.K = +params.get('K');
if (params.get('guide') === '1') $('guide').checked = true;
setSliders(); $('note').innerHTML = NOTES[st.model];
makeDemos(); seed = 4242; z0 = []; for (let n = 0; n < 24; n++) z0.push(XS.map(() => gauss())); reset();
if (params.get('run') === '1' && st.model !== 'mse') { while (stepIdx < st.K) stepOnce(); draw(); }
</script>
</body>
</html>
