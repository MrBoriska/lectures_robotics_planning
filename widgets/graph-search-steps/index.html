<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пошаговый разбор: Дейкстра, A* и Theta*</title>
  <!-- Some static servers (e.g. `serve` with clean URLs on) answer
       /widgets/<name>/index.html by rewriting the URL to /widgets/<name>.
       That moves the document base up one level, so "../common/..." points
       outside the widgets folder and the stylesheet 404s, leaving the
       simulator unstyled and effectively blank. Fall back to the path that
       is correct under the rewritten base. -->
  <link rel="stylesheet" href="../common/widget-base.css"
        onerror="this.onerror=null; this.href='common/widget-base.css';">
  <style>
    .statusbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 4px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border-color);
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .statusbar b { color: var(--text-main); font-variant-numeric: tabular-nums; }
    .statusbar .sep { color: #cbd5e1; }
    .goal-note { margin-left: auto; font-weight: 600; color: var(--accent-green); }

    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(150px, 0.5fr) minmax(230px, 0.85fr);
      gap: 8px;
      padding: 8px;
      background: var(--bg-widget);
    }

    .pane {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-light);
      padding: 6px 10px 4px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .pane-title .g { color: #0284c7; }
    .pane-title .h { color: #b45309; }
    .pane-title .f { color: #0f172a; }

    .pane-body { flex: 1; min-height: 0; overflow: auto; position: relative; }

    /* ---- OPEN priority queue ---- */
    table.queue { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
    table.queue th {
      position: sticky; top: 0; background: var(--bg-control); color: var(--text-muted);
      font-weight: 600; text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--border-color);
    }
    table.queue th:first-child { text-align: left; }
    table.queue td { padding: 2px 6px; text-align: right; border-bottom: 1px solid #f1f5f9; color: #334155; }
    table.queue td:first-child { text-align: left; color: var(--text-main); }
    table.queue tr.top td { background: #cffafe; color: #0e7490; font-weight: 700; }
    table.queue tr.touched td { background: #fef3c7; color: #92400e; font-weight: 600; }
    .queue-note { padding: 5px 8px; font-size: 10.5px; color: var(--text-light); }

    /* ---- pseudocode ---- */
    ol.code { list-style: none; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; padding: 5px 0; counter-reset: ln; }
    ol.code li { counter-increment: ln; padding: 0 8px 0 28px; position: relative; color: #64748b; white-space: pre; }
    ol.code li::before {
      content: counter(ln); position: absolute; left: 0; width: 20px;
      text-align: right; color: #cbd5e1; font-size: 9.5px;
    }
    ol.code li.on { background: #ecfdf5; color: #065f46; font-weight: 600; box-shadow: inset 2px 0 0 var(--accent-green); }

    /* ---- narration ---- */
    .narration {
      flex-shrink: 0; border-top: 1px solid var(--border-color); background: #f8fafc;
      padding: 7px 10px; font-size: 11.5px; line-height: 1.4; color: #334155; min-height: 62px;
    }
    .narration .title { display: block; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .narration .ok { color: var(--accent-green); font-weight: 600; }
    .narration .no { color: var(--accent-red); font-weight: 600; }
    .narration .why { display: block; margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .narration code { font-family: var(--font-mono); background: #eef2f7; border-radius: 3px; padding: 0 3px; }

    .legend { display: flex; gap: 9px; font-size: 10.5px; color: var(--text-muted); align-items: center; flex-wrap: wrap; }
    .legend-box { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid transparent; }
    .c-open { background: #dceffb; border-color: #93c5ea; }
    .c-closed { background: #fdedd3; border-color: #f0c893; }
    .c-cur { background: #a5f3fc; border-color: #0e7490; }
    .c-path { background: #059669; }

    input[type="range"].scrub { flex: 1; min-width: 70px; accent-color: #0284c7; }
  </style>
</head>
<body>
  <div class="widget-layout">
    <div class="toolbar">
      <select id="algo" class="select-control">
        <option value="dijkstra">Дейкстра (h = 0)</option>
        <option value="astar" selected>A* (h = евклид)</option>
        <option value="theta">Theta* (any-angle)</option>
      </select>
      <button id="back" class="btn">◀</button>
      <button id="fwd" class="btn btn-primary">Шаг ▶</button>
      <button id="nextIter" class="btn btn-success">Итерация ⏭</button>
      <button id="play" class="btn">Авто ⏵</button>
      <button id="end" class="btn">В конец</button>
      <button id="reset" class="btn btn-danger">Сброс</button>
      <input type="range" id="scrub" class="scrub" min="0" value="0">
      <div class="legend">
        <span><i class="legend-box c-cur"></i> сейчас</span>
        <span><i class="legend-box c-open"></i> в очереди</span>
        <span><i class="legend-box c-closed"></i> готово</span>
        <span><i class="legend-box c-path"></i> путь</span>
      </div>
    </div>

    <div class="statusbar">
      <span>Итерация <b id="stIter">–</b></span>
      <span class="sep">|</span>
      <span>шаг внутри итерации <b id="stSub">–</b></span>
      <span class="sep">|</span>
      <span>раскрыто клеток <b id="stExp">0</b></span>
      <span class="sep">|</span>
      <span>в очереди <b id="stOpen">0</b></span>
      <span class="goal-note" id="stGoal"></span>
    </div>

    <div class="stage">
      <div class="pane">
        <div class="pane-title" id="gridTitle"></div>
        <div class="pane-body"><canvas id="grid"></canvas></div>
      </div>

      <div class="pane">
        <div class="pane-title">Очередь OPEN</div>
        <div class="pane-body" id="queueBody"></div>
      </div>

      <div class="pane">
        <div class="pane-title" id="codeTitle">Псевдокод</div>
        <div class="pane-body"><ol class="code" id="code"></ol></div>
        <div class="narration" id="narration"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Scenario. Deliberately the same map as the static A*/Theta* figure in
  // the lecture, so the stepped walkthrough and the printed slide agree.
  // ---------------------------------------------------------------------
  var COLS = 10, ROWS = 7;
  var WALLS = ['4,2', '4,3', '4,4', '5,4'];
  var START = { x: 0, y: 6 }, GOAL = { x: 9, y: 0 };

  var key = function (x, y) { return x + ',' + y; };
  var isWall = function (x, y) { return WALLS.indexOf(key(x, y)) !== -1; };
  var inside = function (x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; };
  var dist = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };

  // Supercover line of sight, the same test Theta* itself uses.
  function lineOfSight(a, b) {
    var x = a.x, y = a.y;
    var dx = Math.abs(b.x - x), dy = Math.abs(b.y - y);
    var sx = b.x > x ? 1 : -1, sy = b.y > y ? 1 : -1, err, i;
    if (dx >= dy) {
      err = (dx / 2) | 0;
      for (i = 0; i < dx; i++) {
        err -= dy;
        if (err < 0) {
          y += sy; err += dx;
          if (isWall(x, y) || isWall(x + sx, y - sy)) return false;
        }
        x += sx;
        if (isWall(x, y)) return false;
      }
    } else {
      err = (dy / 2) | 0;
      for (i = 0; i < dy; i++) {
        err -= dx;
        if (err < 0) {
          x += sx; err += dy;
          if (isWall(x, y) || isWall(x - sx, y + sy)) return false;
        }
        y += sy;
        if (isWall(x, y)) return false;
      }
    }
    return true;
  }

  var PSEUDO = {
    dijkstra: [
      'OPEN ← {старт},  g(старт) ← 0',
      'пока OPEN не пуста:',
      '    s ← клетка с наименьшим g',
      '    если s = цель: путь найден',
      '    перенести s в CLOSED',
      '    для каждого соседа s\' клетки s:',
      '        если s\' в CLOSED: пропустить',
      '        g_нов ← g(s) + длина(s, s\')',
      '        если g_нов < g(s\'):',
      '            g(s\') ← g_нов',
      '            родитель(s\') ← s',
      '            положить s\' в OPEN'
    ],
    astar: [
      'OPEN ← {старт},  g(старт) ← 0',
      'пока OPEN не пуста:',
      '    s ← клетка с наименьшим f = g + h',
      '    если s = цель: путь найден',
      '    перенести s в CLOSED',
      '    для каждого соседа s\' клетки s:',
      '        если s\' в CLOSED: пропустить',
      '        g_нов ← g(s) + длина(s, s\')',
      '        если g_нов < g(s\'):',
      '            g(s\') ← g_нов',
      '            родитель(s\') ← s',
      '            положить s\' в OPEN с f = g + h'
    ],
    theta: [
      'OPEN ← {старт},  g(старт) ← 0',
      'пока OPEN не пуста:',
      '    s ← клетка с наименьшим f = g + h',
      '    если s = цель: путь найден',
      '    перенести s в CLOSED',
      '    для каждого соседа s\' клетки s:',
      '        если s\' в CLOSED: пропустить',
      '        // Путь 2: попробовать срезать, минуя s',
      '        если ЛучСвободен(родитель(s), s\'):',
      '            p ← родитель(s)',
      '        иначе:',
      '            p ← s              // Путь 1',
      '        g_нов ← g(p) + длина(p, s\')',
      '        если g_нов < g(s\'):',
      '            g(s\') ← g_нов;  родитель(s\') ← p',
      '            положить s\' в OPEN с f = g + h'
    ]
  };

  var LINE = {
    dijkstra: { init: 0, pop: 2, close: 4, skip: 6, better: 8, worse: 8, push: 11, done: 3 },
    astar:    { init: 0, pop: 2, close: 4, skip: 6, better: 8, worse: 8, push: 11, done: 3 },
    theta:    { init: 0, pop: 2, close: 4, skip: 6, los: 8, better: 13, worse: 13, push: 15, done: 3 }
  };

  // ---------------------------------------------------------------------
  // Trace builder. The search runs once up front and is recorded as frames,
  // so stepping backwards and scrubbing are exact rather than re-simulated.
  // Every frame carries the iteration it belongs to — that is what makes
  // several hundred micro-steps navigable instead of an undifferentiated run.
  // ---------------------------------------------------------------------
  function buildTrace(algo) {
    var anyAngle = algo === 'theta';
    var useH = algo !== 'dijkstra';
    var h = function (x, y) { return useH ? dist({ x: x, y: y }, GOAL) : 0; };

    var g = {}, parent = {}, closed = {}, open = [];
    var frames = [];
    var expanded = 0;
    var iter = 0;

    function snapshot(extra) {
      var f = {
        iter: iter,
        g: JSON.parse(JSON.stringify(g)),
        parent: JSON.parse(JSON.stringify(parent)),
        closed: Object.keys(closed),
        open: open.map(function (n) { return { k: n.k, x: n.x, y: n.y, g: n.g, h: n.h, f: n.f }; })
                  .sort(function (a, b) { return a.f - b.f || a.g - b.g; }),
        expanded: expanded
      };
      for (var p in extra) f[p] = extra[p];
      frames.push(f);
    }

    function pushOpen(x, y, gv) {
      var k = key(x, y), hv = h(x, y);
      for (var i = 0; i < open.length; i++) {
        if (open[i].k === k) { open[i].g = gv; open[i].f = gv + hv; return; }
      }
      open.push({ k: k, x: x, y: y, g: gv, h: hv, f: gv + hv });
    }

    var sk = key(START.x, START.y);
    g[sk] = 0;
    parent[sk] = sk;
    pushOpen(START.x, START.y, 0);
    snapshot({
      phase: 'init', cur: null, focus: null,
      title: 'Подготовка',
      text: 'Стоимость старта <code>g = 0</code>, кладём его в очередь OPEN.',
      why: useH
        ? 'OPEN всегда отсортирована по <code>f = g + h</code>: первой обрабатывается самая перспективная клетка.'
        : 'Эвристики нет, <code>h = 0</code>, поэтому порядок задаёт только пройденное расстояние <code>g</code>.'
    });

    var guard = 0;
    while (open.length && guard++ < 4000) {
      open.sort(function (a, b) { return a.f - b.f || a.g - b.g; });
      var queueSize = open.length;
      var cur = open.shift();
      expanded++;
      iter++;

      var atGoal = cur.x === GOAL.x && cur.y === GOAL.y;
      snapshot({
        phase: 'pop', cur: cur, focus: null,
        title: 'Берём из очереди клетку ' + cur.k,
        text: useH
          ? 'g = ' + cur.g.toFixed(2) + ', h = ' + cur.h.toFixed(2) + ' → <b>f = ' + cur.f.toFixed(2) + '</b>.'
          : '<b>g = ' + cur.g.toFixed(2) + '</b>.',
        why: 'Это минимум среди ' + queueSize + ' клеток очереди — потому её и обрабатываем первой.'
      });

      if (atGoal) {
        var path = [], node = cur.k;
        while (node !== parent[node]) { path.push(node); node = parent[node]; }
        path.push(sk);
        path.reverse();
        snapshot({
          phase: 'done', cur: cur, focus: null, path: path,
          title: 'Готово: цель извлечена из очереди',
          text: 'Длина пути <b>' + cur.g.toFixed(2) + '</b>, изломов <b>' + Math.max(0, path.length - 2) +
                '</b>, раскрыто клеток <b>' + expanded + '</b>.',
          why: 'Как только цель оказалась первой в очереди, более короткого пути уже быть не может — поиск останавливается.'
        });
        return { frames: frames, algo: algo, iterations: iter };
      }

      closed[cur.k] = true;
      snapshot({
        phase: 'close', cur: cur, focus: null,
        title: 'Клетка ' + cur.k + ' закрыта',
        text: 'Переносим её в CLOSED.',
        why: 'Кратчайший путь до неё уже найден: маршрут короче всплыл бы в очереди раньше.'
      });

      for (var dx = -1; dx <= 1; dx++) {
        for (var dy = -1; dy <= 1; dy++) {
          if (!dx && !dy) continue;
          var nx = cur.x + dx, ny = cur.y + dy, nk = key(nx, ny);
          if (!inside(nx, ny) || isWall(nx, ny)) continue;
          if (dx && dy && (isWall(cur.x + dx, cur.y) || isWall(cur.x, cur.y + dy))) continue;
          if (closed[nk]) {
            snapshot({
              phase: 'skip', cur: cur, focus: { x: nx, y: ny },
              title: 'Сосед ' + nk + ' — пропускаем',
              text: 'Он уже в CLOSED.',
              why: 'Закрытые клетки не пересчитываются: их значение g окончательное.'
            });
            continue;
          }

          var anchor = cur, tag = '', pnode = null;
          if (anyAngle) {
            var pk = parent[cur.k].split(',');
            pnode = { x: +pk[0], y: +pk[1] };
            var losOK = lineOfSight(pnode, { x: nx, y: ny });
            snapshot({
              phase: 'los', cur: cur, focus: { x: nx, y: ny },
              ray: [pnode, { x: nx, y: ny }], losOK: losOK, grandparent: pnode,
              title: 'Виден ли ' + nk + ' напрямую из ' + parent[cur.k] + '?',
              text: losOK
                ? '<span class="ok">Да, луч свободен</span> — соседа можно подцепить сразу к ' + parent[cur.k] +
                  ', минуя ' + cur.k + '.'
                : '<span class="no">Нет, луч задевает препятствие</span> — остаётся связь через ' + cur.k + '.',
              why: 'Эта проверка и отличает Theta* от A*: она разрешает ребро под любым углом, а не только по рёбрам сетки.'
            });
            if (losOK) { anchor = { k: parent[cur.k], x: pnode.x, y: pnode.y }; tag = ' — срезаем угол'; }
            else { tag = ' — через ' + cur.k; }
          }

          var step = dist(anchor, { x: nx, y: ny });
          var gNew = g[anchor.k] + step;
          var gOld = g.hasOwnProperty(nk) ? g[nk] : Infinity;
          var better = gNew < gOld - 1e-9;

          snapshot({
            phase: better ? 'better' : 'worse',
            cur: cur, focus: { x: nx, y: ny }, edge: [anchor, { x: nx, y: ny }],
            grandparent: anyAngle ? pnode : null,
            candidate: better ? { k: nk } : null,
            title: 'Считаем стоимость соседа ' + nk + tag,
            text: 'g(' + anchor.k + ') + ' + step.toFixed(2) + ' = <b>' + gNew.toFixed(2) + '</b>, ' +
                  'сейчас у ' + nk + ' записано ' + (gOld === Infinity ? '∞' : gOld.toFixed(2)) + '.',
            why: better
              ? 'Новый маршрут короче — <span class="ok">запоминаем его</span>.'
              : 'Новый маршрут не короче — <span class="no">оставляем прежнего родителя</span>.'
          });

          if (better) {
            g[nk] = gNew;
            parent[nk] = anchor.k;
            pushOpen(nx, ny, gNew);
            snapshot({
              phase: 'push', cur: cur, focus: { x: nx, y: ny }, edge: [anchor, { x: nx, y: ny }],
              candidate: { k: nk }, grandparent: anyAngle ? pnode : null,
              title: 'Обновляем ' + nk,
              text: 'родитель(' + nk + ') = ' + anchor.k + ', ' +
                    (useH ? 'f = ' + (gNew + h(nx, ny)).toFixed(2) : 'g = ' + gNew.toFixed(2)) + '.',
              why: 'Клетка встаёт в очередь на новое место — тем выше, чем меньше её оценка.'
            });
          }
        }
      }
    }

    snapshot({
      phase: 'done', cur: null, focus: null,
      title: 'Очередь пуста', text: 'Цель недостижима.', why: ''
    });
    return { frames: frames, algo: algo, iterations: iter };
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  var canvas = document.getElementById('grid');
  var ctx = canvas.getContext('2d');
  var queueBody = document.getElementById('queueBody');
  var codeEl = document.getElementById('code');
  var codeTitle = document.getElementById('codeTitle');
  var narration = document.getElementById('narration');
  var scrub = document.getElementById('scrub');
  var stIter = document.getElementById('stIter');
  var stSub = document.getElementById('stSub');
  var stExp = document.getElementById('stExp');
  var stOpen = document.getElementById('stOpen');
  var stGoal = document.getElementById('stGoal');
  var gridTitle = document.getElementById('gridTitle');

  var trace = null, idx = 0, timer = null;

  function fit() {
    var box = canvas.parentElement;
    var ratio = window.devicePixelRatio || 1;
    canvas.width = box.clientWidth * ratio;
    canvas.height = box.clientHeight * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }

  // ---------------------------------------------------------------------
  // Canvas sizing guard.
  //
  // The canvas backing store is set from the container's clientWidth/Height.
  // Inside a Marp slide the iframe is sometimes still unlaid-out when this
  // first runs, so the measurement returns 0, the canvas is created 0x0 and
  // the widget draws nothing at all — the toolbar shows, the picture never
  // appears. A lone ResizeObserver is not enough to recover from that, so
  // re-measure until the box reports a real size, and re-fit on every event
  // that can change it.
  // ---------------------------------------------------------------------
  function autosize(element, onResize) {
    if (!element) return;
    var frameTries = 0;
    var ticks = 0;
    var poll = null;

    function sized() {
      return element.clientWidth > 0 && element.clientHeight > 0;
    }

    function attempt() {
      onResize();
      if (sized()) return;
      if (frameTries++ < 240) {
        window.requestAnimationFrame(attempt);
      } else if (!poll) {
        poll = setInterval(function () {
          onResize();
          if (sized() || ticks++ > 40) { clearInterval(poll); poll = null; }
        }, 250);
      }
    }

    // Deferred, never synchronous: the widget finishes building its state
    // further down the script, and calling the draw path inline here would
    // run it against half-initialised data.
    window.requestAnimationFrame(attempt);
    window.addEventListener('resize', onResize);
    window.addEventListener('pageshow', onResize);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) onResize();
    });
    if (window.ResizeObserver) new window.ResizeObserver(onResize).observe(element);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(onResize).catch(function () {});
    }
  }

  function geometry() {
    var W = canvas.clientWidth || canvas.parentElement.clientWidth;
    var H = canvas.clientHeight || canvas.parentElement.clientHeight;
    var cell = Math.max(18, Math.min((W - 16) / COLS, (H - 16) / ROWS));
    return { cell: cell, ox: (W - cell * COLS) / 2, oy: (H - cell * ROWS) / 2 };
  }

  function draw() {
    var W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.clearRect(0, 0, W, H);
    if (!trace) return;
    var fr = trace.frames[idx];
    var geo = geometry(), cell = geo.cell, ox = geo.ox, oy = geo.oy;
    var cx = function (x) { return ox + x * cell + cell / 2; };
    var cy = function (y) { return oy + y * cell + cell / 2; };

    var openKeys = {};
    fr.open.forEach(function (n) { openKeys[n.k] = n; });
    var closedKeys = {};
    fr.closed.forEach(function (k) { closedKeys[k] = true; });

    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var k = key(x, y), px = ox + x * cell, py = oy + y * cell;
        var fill = '#ffffff', stroke = '#e2e8f0';
        if (isWall(x, y)) { fill = '#334155'; stroke = '#1e293b'; }
        else if (fr.cur && fr.cur.k === k) { fill = '#a5f3fc'; stroke = '#0e7490'; }
        else if (closedKeys[k]) { fill = '#fdedd3'; stroke = '#f0c893'; }
        else if (openKeys[k]) { fill = '#dceffb'; stroke = '#93c5ea'; }

        ctx.fillStyle = fill;
        ctx.fillRect(px, py, cell, cell);
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, cell - 1, cell - 1);

        // g (blue, top-left), h (amber, top-right), f (black, centre) — the
        // three numbers the algorithm actually compares, colour-coded so the
        // arithmetic in the narration can be traced back to the picture.
        if (!isWall(x, y) && fr.g.hasOwnProperty(k) && cell >= 32) {
          var gv = fr.g[k];
          var hv = trace.algo === 'dijkstra' ? 0 : dist({ x: x, y: y }, GOAL);
          ctx.font = Math.round(cell * 0.17) + 'px "JetBrains Mono", monospace';
          ctx.fillStyle = '#0284c7';
          ctx.textAlign = 'left';
          ctx.fillText(gv.toFixed(1), px + 3, py + cell * 0.21);
          if (trace.algo !== 'dijkstra') {
            ctx.fillStyle = '#b45309';
            ctx.textAlign = 'right';
            ctx.fillText(hv.toFixed(1), px + cell - 3, py + cell * 0.21);
          }
          ctx.fillStyle = '#0f172a';
          ctx.font = '700 ' + Math.round(cell * 0.28) + 'px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText((gv + hv).toFixed(1), px + cell / 2, py + cell * 0.64);
        }
      }
    }

    // The parent chain from the current cell back to the start. This is what
    // g measures, so drawing it turns the number into something visible.
    if (fr.cur && !fr.path) {
      var chain = [], node = fr.cur.k, guard = 0;
      while (fr.parent[node] && node !== fr.parent[node] && guard++ < 200) {
        chain.push(node);
        node = fr.parent[node];
      }
      chain.push(node);
      if (chain.length > 1) {
        ctx.strokeStyle = 'rgba(2, 132, 199, 0.4)';
        ctx.lineWidth = Math.max(2.5, cell * 0.07);
        ctx.lineJoin = ctx.lineCap = 'round';
        ctx.beginPath();
        chain.forEach(function (kk, i) {
          var a = kk.split(',');
          ctx[i ? 'lineTo' : 'moveTo'](cx(+a[0]), cy(+a[1]));
        });
        ctx.stroke();
      }
    }

    // Theta*: name the grandparent the line-of-sight test is aimed from.
    if (fr.grandparent) {
      var gpx = ox + fr.grandparent.x * cell, gpy = oy + fr.grandparent.y * cell;
      ctx.strokeStyle = '#7c3aed';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(gpx + 2, gpy + 2, cell - 4, cell - 4);
      ctx.setLineDash([]);
      // Above the cell when there is room: inside it the label collided with
      // the S/G corner badge.
      var lblY = gpy > 16 ? gpy - 5 : gpy + cell + 12;
      var lblSize = Math.round(Math.min(cell * 0.19, 12));
      ctx.font = '700 ' + lblSize + 'px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText('родитель(s)', gpx + cell / 2, lblY);
      ctx.fillStyle = '#7c3aed';
      ctx.fillText('родитель(s)', gpx + cell / 2, lblY);
    }

    // Neighbour currently under consideration.
    if (fr.focus) {
      var fx = ox + fr.focus.x * cell, fy = oy + fr.focus.y * cell;
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 3;
      ctx.strokeRect(fx + 1.5, fy + 1.5, cell - 3, cell - 3);
    }

    if (fr.ray) {
      ctx.strokeStyle = fr.losOK ? '#7c3aed' : '#dc2626';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(cx(fr.ray[0].x), cy(fr.ray[0].y));
      ctx.lineTo(cx(fr.ray[1].x), cy(fr.ray[1].y));
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (fr.edge) {
      ctx.strokeStyle = fr.phase === 'worse' ? '#dc2626' : '#d97706';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx(fr.edge[0].x), cy(fr.edge[0].y));
      ctx.lineTo(cx(fr.edge[1].x), cy(fr.edge[1].y));
      ctx.stroke();
    }

    if (fr.path) {
      ctx.strokeStyle = '#059669';
      ctx.lineWidth = Math.max(3.5, cell * 0.1);
      ctx.lineJoin = ctx.lineCap = 'round';
      ctx.beginPath();
      fr.path.forEach(function (k, i) {
        var a = k.split(',');
        ctx[i ? 'lineTo' : 'moveTo'](cx(+a[0]), cy(+a[1]));
      });
      ctx.stroke();
    }

    [[START, '#0284c7', 'S'], [GOAL, '#dc2626', 'G']].forEach(function (m) {
      var px = ox + m[0].x * cell, py = oy + m[0].y * cell;
      ctx.strokeStyle = m[1];
      ctx.lineWidth = 2.5;
      ctx.strokeRect(px + 1.5, py + 1.5, cell - 3, cell - 3);
      var r = Math.max(6, cell * 0.16);
      ctx.fillStyle = m[1];
      ctx.beginPath();
      ctx.arc(px + cell - r - 2, py + cell - r - 2, r, 0, 6.284);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 ' + Math.round(r * 1.25) + 'px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(m[2], px + cell - r - 2, py + cell - r - 2);
      ctx.textBaseline = 'alphabetic';
    });
  }

  var MAX_ROWS = 9;

  function renderQueue() {
    var fr = trace.frames[idx];
    if (!fr.open.length) {
      queueBody.innerHTML = '<div class="queue-note">очередь пуста</div>';
      return;
    }
    var useH = trace.algo !== 'dijkstra';
    var shown = fr.open.slice(0, MAX_ROWS);
    var rows = shown.map(function (n, i) {
      var cls = i === 0 ? ' class="top"' : (fr.candidate && fr.candidate.k === n.k ? ' class="touched"' : '');
      return '<tr' + cls + '><td>' + n.k + '</td><td>' + n.g.toFixed(2) + '</td>' +
             (useH ? '<td>' + n.h.toFixed(2) + '</td>' : '') +
             '<td>' + n.f.toFixed(2) + '</td></tr>';
    }).join('');
    var more = fr.open.length - shown.length;
    queueBody.innerHTML =
      '<table class="queue"><thead><tr><th>клетка</th><th>g</th>' +
      (useH ? '<th>h</th>' : '') + '<th>' + (useH ? 'f' : 'ключ') + '</th></tr></thead><tbody>' +
      rows + '</tbody></table>' +
      (more > 0 ? '<div class="queue-note">…и ещё ' + more + ' — дальше в очереди</div>' : '');
  }

  function renderCode() {
    var fr = trace.frames[idx];
    var line = LINE[trace.algo][fr.phase];
    Array.prototype.forEach.call(codeEl.children, function (li, i) {
      li.className = i === line ? 'on' : '';
    });
  }

  function iterBounds(i) {
    var it = trace.frames[i].iter, from = i, to = i;
    while (from > 0 && trace.frames[from - 1].iter === it) from--;
    while (to < trace.frames.length - 1 && trace.frames[to + 1].iter === it) to++;
    return { from: from, to: to };
  }

  function render() {
    var fr = trace.frames[idx];
    narration.innerHTML = '<span class="title">' + fr.title + '</span>' + fr.text +
                          (fr.why ? '<span class="why">' + fr.why + '</span>' : '');
    var b = iterBounds(idx);
    stIter.textContent = fr.iter === 0 ? '— подготовка' : fr.iter + ' из ' + trace.iterations;
    stSub.textContent = (idx - b.from + 1) + ' из ' + (b.to - b.from + 1);
    stExp.textContent = fr.expanded;
    stOpen.textContent = fr.open.length;
    stGoal.textContent = fr.path
      ? 'путь ' + fr.g[key(GOAL.x, GOAL.y)].toFixed(2) + ' · изломов ' + Math.max(0, fr.path.length - 2)
      : '';
    scrub.value = idx;
    renderQueue();
    renderCode();
    draw();
  }

  function load(algo) {
    stop();
    trace = buildTrace(algo);
    idx = 0;
    codeTitle.textContent = 'Псевдокод — ' +
      ({ dijkstra: 'Дейкстра', astar: 'A*', theta: 'Theta*' })[algo];
    // Dijkstra shows no h, so promising one in the legend would be a lie.
    gridTitle.innerHTML = algo === 'dijkstra'
      ? 'В клетке: <span class="g">g — пройденное расстояние</span> · эвристики нет, <span class="h">h = 0</span>'
      : 'В клетке: <span class="g">g — пройдено</span> · <span class="h">h — оценка до цели</span> · <span class="f">f = g + h</span>';
    codeEl.innerHTML = PSEUDO[algo].map(function (l) {
      return '<li>' + l.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>';
    }).join('');
    scrub.max = trace.frames.length - 1;
    render();
  }

  function go(delta) {
    idx = Math.max(0, Math.min(trace.frames.length - 1, idx + delta));
    render();
  }

  function jumpIteration() {
    var it = trace.frames[idx].iter;
    var i = idx;
    while (i < trace.frames.length - 1 && trace.frames[i].iter === it) i++;
    idx = i;
    render();
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    var btn = document.getElementById('play');
    btn.textContent = 'Авто ⏵';
    btn.classList.remove('btn-danger');
  }

  document.getElementById('fwd').onclick = function () { stop(); go(1); };
  document.getElementById('back').onclick = function () { stop(); go(-1); };
  document.getElementById('nextIter').onclick = function () { stop(); jumpIteration(); };
  document.getElementById('end').onclick = function () { stop(); idx = trace.frames.length - 1; render(); };
  document.getElementById('reset').onclick = function () { load(document.getElementById('algo').value); };
  document.getElementById('algo').onchange = function () { load(this.value); };
  scrub.oninput = function () { stop(); idx = +this.value; render(); };

  document.getElementById('play').onclick = function () {
    if (timer) { stop(); return; }
    this.textContent = 'Пауза ⏸';
    this.classList.add('btn-danger');
    var self = this;
    timer = setInterval(function () {
      if (idx >= trace.frames.length - 1) { stop(); self.textContent = 'Авто ⏵'; return; }
      go(1);
    }, 240);
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); go(1); }
    if (e.key === 'ArrowLeft') { stop(); go(-1); }
    if (e.key === 'ArrowDown') { stop(); jumpIteration(); }
  });

  // A slide can deep-link to the algorithm it is about: .../index.html#theta
  var wanted = (location.hash || '').replace('#', '');
  if (!PSEUDO[wanted]) wanted = 'astar';
  document.getElementById('algo').value = wanted;
  load(wanted);
  autosize(canvas.parentElement, fit);
})();
</script>
</body>
</html>
