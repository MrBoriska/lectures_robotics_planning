<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный RRT / RRT* / RRT-Connect / Informed RRT* Visualizer</title>
  <link rel="stylesheet" href="../common/widget-base.css"
        onerror="this.onerror=null; this.href='common/widget-base.css';">
</head>
<body>
  <div class="widget-layout">
    <div class="toolbar">
      <select id="algoSelect" class="select-control">
        <option value="rrt">RRT (Классический)</option>
        <option value="rrt-connect">RRT-Connect (Двунаправленный)</option>
        <option value="rrt-star">RRT* (Асимптотически оптимальный)</option>
        <option value="informed-rrt-star">Informed RRT* (Эллипсоидный сэмплинг)</option>
      </select>

      <button id="btnStep" class="btn">▶ Шаг</button>
      <button id="btnRun" class="btn btn-primary">⚡ Запуск</button>
      <button id="btnShortcut" class="btn btn-success">✂️ Сгладить</button>
      <button id="btnReset" class="btn">🔄 Сброс</button>
      <button id="btnClearObs" class="btn">🧹 Препятствия</button>

      <div class="slider-group">
        <span>Шаг:</span>
        <input type="range" id="stepSizeSlider" min="10" max="45" value="22">
      </div>

      <div class="slider-group">
        <span>Goal Bias:</span>
        <input type="range" id="goalBiasSlider" min="0" max="40" value="10">
      </div>

      <div class="stats-bar">
        <div class="stat-item">Узлы: <span id="statNodes">1</span></div>
        <div class="stat-item">Итерации: <span id="statIter">0</span></div>
        <div class="stat-item">Длина пути: <span id="statCost">-</span></div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="rrtCanvas"></canvas>
      <div class="overlay-hint">Кликните и потяните, чтобы создать круглые препятствия. Перетаскивайте S и G. Переключайте алгоритмы сверху.</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('rrtCanvas');
    const ctx = canvas.getContext('2d');

    let width = 800;
    let height = 500;

    let start = null;
    let goal = null;

    // Tree structures
    // For RRT, RRT*, Informed: nodes is Tree A
    let nodes = [];
    // For RRT-Connect: nodesB is Tree B (rooted at goal)
    let nodesB = [];

    let obstacles = [];
    let lastSample = null;
    let pathFoundNode = null;
    let connectMeetingNodes = null; // { a, b } for RRT-Connect
    let shortcutPath = null;
    let isRunning = false;
    let animFrame = null;
    let iterations = 0;

    let isDrawingObstacle = false;
    let newObsStart = null;
    let draggingPoint = null;

    function initEnvironment() {
      start = { x: Math.round(width * 0.12), y: Math.round(height * 0.5) };
      goal = { x: Math.round(width * 0.88), y: Math.round(height * 0.5), radius: Math.min(26, Math.max(18, height * 0.055)) };
      const rScale = Math.min(width, height) / 500;
      obstacles = [
        { x: width * 0.38, y: height * 0.32, r: 65 * rScale },
        { x: width * 0.40, y: height * 0.70, r: 75 * rScale },
        { x: width * 0.64, y: height * 0.50, r: 85 * rScale }
      ];
    }

    function resize() {
      const container = canvas.parentElement;
      if (!container) return;
      const newW = container.clientWidth;
      const newH = container.clientHeight;
      if (newW < 50 || newH < 50) return;

      const prevW = width;
      const prevH = height;
      width = newW;
      height = newH;
      canvas.width = width;
      canvas.height = height;

      if (!start || isNaN(start.x) || (start.x <= 25 && start.y <= 25) || prevW < 50 || prevH < 50) {
        initEnvironment();
        resetTree();
        return;
      }

      const sx = width / prevW;
      const sy = height / prevH;
      if (!isFinite(sx) || !isFinite(sy) || sx <= 0 || sy <= 0) {
        initEnvironment();
        resetTree();
        return;
      }

      start.x = Math.max(15, Math.min(width - 15, start.x * sx));
      start.y = Math.max(15, Math.min(height - 15, start.y * sy));
      goal.x = Math.max(15, Math.min(width - 15, goal.x * sx));
      goal.y = Math.max(15, Math.min(height - 15, goal.y * sy));
      for (const obs of obstacles) {
        obs.x *= sx;
        obs.y *= sy;
        obs.r *= Math.min(sx, sy);
      }
      for (const n of nodes) {
        n.x *= sx;
        n.y *= sy;
      }
      for (const n of nodesB) {
        n.x *= sx;
        n.y *= sy;
      }
      draw();
    }

    function autosize(element, onResize) {
      if (!element) return;
      let frames = 0;
      let ticks = 0;
      let poll = null;

      function sized() {
        return element.clientWidth > 50 && element.clientHeight > 50;
      }

      function attempt() {
        if (!sized()) {
          if (frames++ < 240) {
            window.requestAnimationFrame(attempt);
          } else if (!poll) {
            poll = setInterval(function () {
              if (sized() || ticks++ > 40) {
                clearInterval(poll);
                poll = null;
                if (sized()) onResize();
              }
            }, 250);
          }
          return;
        }
        onResize();
      }

      window.requestAnimationFrame(attempt);
      window.addEventListener('resize', onResize);
      window.addEventListener('pageshow', onResize);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && sized()) onResize();
      });
      if (window.ResizeObserver) {
        new window.ResizeObserver(() => {
          if (sized()) onResize();
        }).observe(element);
      }
    }

    autosize(canvas.parentElement, resize);

    function resetTree() {
      if (animFrame) cancelAnimationFrame(animFrame);
      isRunning = false;
      document.getElementById('btnRun').textContent = '⚡ Запуск';
      document.getElementById('btnRun').className = 'btn btn-primary';

      if (!start) initEnvironment();
      nodes = [{ x: start.x, y: start.y, parent: null, cost: 0 }];
      nodesB = [{ x: goal.x, y: goal.y, parent: null, cost: 0 }];
      lastSample = null;
      pathFoundNode = null;
      connectMeetingNodes = null;
      shortcutPath = null;
      iterations = 0;
      updateStats();
      draw();
    }

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function isPointInObstacle(p, margin = 0) {
      for (const obs of obstacles) {
        if (dist(p, obs) <= obs.r + margin) return true;
      }
      return false;
    }

    function isSegmentColliding(p1, p2) {
      const d = dist(p1, p2);
      const steps = Math.max(3, Math.ceil(d / 4));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const pt = {
          x: p1.x + (p2.x - p1.x) * t,
          y: p1.y + (p2.y - p1.y) * t
        };
        if (isPointInObstacle(pt, 2)) return true;
      }
      return false;
    }

    function getBestCost() {
      if (connectMeetingNodes) {
        return connectMeetingNodes.a.cost + connectMeetingNodes.b.cost + dist(connectMeetingNodes.a, connectMeetingNodes.b);
      }
      if (pathFoundNode) {
        return pathFoundNode.cost + dist(pathFoundNode, goal);
      }
      return Infinity;
    }

    function sample() {
      const algo = document.getElementById('algoSelect').value;
      const cBest = getBestCost();
      const cMin = dist(start, goal);

      // Informed RRT*: sample in prolate hyperspheroid (ellipse in 2D) if path found
      if (algo === 'informed-rrt-star' && cBest < Infinity && cBest >= cMin) {
        const a = cBest / 2;
        const b = Math.sqrt(Math.max(1, cBest * cBest - cMin * cMin)) / 2;
        const cx = (start.x + goal.x) / 2;
        const cy = (start.y + goal.y) / 2;
        const angle = Math.atan2(goal.y - start.y, goal.x - start.x);

        // Uniform sample in unit circle
        const r = Math.sqrt(Math.random());
        const phi = Math.random() * Math.PI * 2;
        const u = r * Math.cos(phi);
        const v = r * Math.sin(phi);

        // Scale by semi-axes
        const ex = u * a;
        const ey = v * b;

        // Rotate and translate
        return {
          x: cx + Math.cos(angle) * ex - Math.sin(angle) * ey,
          y: cy + Math.sin(angle) * ex + Math.cos(angle) * ey
        };
      }

      // Standard sampling with Goal Bias
      const bias = Number(document.getElementById('goalBiasSlider').value) / 100;
      if (Math.random() < bias) {
        return { x: goal.x, y: goal.y };
      }
      return {
        x: Math.random() * width,
        y: Math.random() * height
      };
    }

    function findNearest(tree, pt) {
      let best = tree[0];
      let minD = dist(tree[0], pt);
      for (let i = 1; i < tree.length; i++) {
        const d = dist(tree[i], pt);
        if (d < minD) {
          minD = d;
          best = tree[i];
        }
      }
      return best;
    }

    function steer(from, to, maxStep) {
      const d = dist(from, to);
      if (d <= maxStep) return { x: to.x, y: to.y };
      const theta = Math.atan2(to.y - from.y, to.x - from.x);
      return {
        x: from.x + Math.cos(theta) * maxStep,
        y: from.y + Math.sin(theta) * maxStep
      };
    }

    function propagateSubtreeCost(rootNode, delta) {
      const queue = [rootNode];
      while (queue.length > 0) {
        const curr = queue.shift();
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i].parent === curr) {
            nodes[i].cost += delta;
            queue.push(nodes[i]);
          }
        }
      }
    }

    function step() {
      iterations++;
      const maxStep = Number(document.getElementById('stepSizeSlider').value);
      const algo = document.getElementById('algoSelect').value;

      if (algo === 'rrt-connect') {
        return stepConnect(maxStep);
      }

      const isStar = (algo === 'rrt-star' || algo === 'informed-rrt-star');

      const qRand = sample();
      lastSample = qRand;

      const qNear = findNearest(nodes, qRand);
      const qNew = steer(qNear, qRand, maxStep);

      if (!isSegmentColliding(qNear, qNew)) {
        let parent = qNear;
        let minCost = qNear.cost + dist(qNear, qNew);

        // RRT* ChooseParent
        const rStar = Math.min(maxStep * 2.8, 70);
        if (isStar) {
          for (const node of nodes) {
            const d = dist(node, qNew);
            if (d <= rStar && node.cost + d < minCost) {
              if (!isSegmentColliding(node, qNew)) {
                parent = node;
                minCost = node.cost + d;
              }
            }
          }
        }

        const newNode = {
          x: qNew.x,
          y: qNew.y,
          parent: parent,
          cost: minCost
        };
        nodes.push(newNode);

        // RRT* Rewiring with cascade subtree propagation
        if (isStar) {
          for (const node of nodes) {
            if (node === parent) continue;
            const d = dist(newNode, node);
            if (d <= rStar && newNode.cost + d < node.cost) {
              if (!isSegmentColliding(newNode, node)) {
                const delta = (newNode.cost + d) - node.cost;
                node.parent = newNode;
                node.cost = newNode.cost + d;
                propagateSubtreeCost(node, delta);
              }
            }
          }
        }

        // Check if goal reached or improved
        const dGoal = dist(newNode, goal);
        if (dGoal <= Math.max(goal.radius, maxStep)) {
          if (!isSegmentColliding(newNode, goal)) {
            const totalCost = newNode.cost + dGoal;
            if (!pathFoundNode || totalCost < getBestCost()) {
              pathFoundNode = newNode;
            }
          }
        }
      }

      updateStats();
      draw();
      return true;
    }

    function stepConnect(maxStep) {
      // Tree A and Tree B grow toward each other
      const qRand = { x: Math.random() * width, y: Math.random() * height };
      lastSample = qRand;

      // 1. EXTEND Tree A toward qRand
      const nearA = findNearest(nodes, qRand);
      const newA = steer(nearA, qRand, maxStep);

      if (!isSegmentColliding(nearA, newA)) {
        const nodeA = { x: newA.x, y: newA.y, parent: nearA, cost: nearA.cost + dist(nearA, newA) };
        nodes.push(nodeA);

        // 2. CONNECT Tree B toward newA (greedy multi-step)
        let currB = findNearest(nodesB, nodeA);
        let reachedOrBlocked = false;

        while (!reachedOrBlocked) {
          const nextB = steer(currB, nodeA, maxStep);
          if (isSegmentColliding(currB, nextB)) {
            reachedOrBlocked = true;
          } else {
            const addedB = { x: nextB.x, y: nextB.y, parent: currB, cost: currB.cost + dist(currB, nextB) };
            nodesB.push(addedB);
            currB = addedB;

            // Connected?
            if (dist(currB, nodeA) <= maxStep && !isSegmentColliding(currB, nodeA)) {
              connectMeetingNodes = { a: nodeA, b: currB };
              reachedOrBlocked = true;
            } else if (dist(currB, nodeA) < 1e-3) {
              reachedOrBlocked = true;
            }
          }
        }
      }

      // Swap trees role for balanced growth
      if (nodes.length > nodesB.length + 15) {
        const tmp = nodes;
        nodes = nodesB;
        nodesB = tmp;
      }

      updateStats();
      draw();
      return true;
    }

    function runShortcut() {
      // Extract raw path
      let rawPath = [];
      const algo = document.getElementById('algoSelect').value;

      if (algo === 'rrt-connect') {
        if (!connectMeetingNodes) return;
        // From start to meeting node in tree A
        let curr = connectMeetingNodes.a;
        const pathA = [];
        while (curr) { pathA.push(curr); curr = curr.parent; }
        pathA.reverse();

        // From meeting node in tree B to goal
        let currB = connectMeetingNodes.b;
        const pathB = [];
        while (currB) { pathB.push(currB); currB = currB.parent; }

        rawPath = [...pathA, ...pathB];
      } else {
        if (!pathFoundNode) return;
        let curr = pathFoundNode;
        rawPath.push(goal);
        while (curr) {
          rawPath.push(curr);
          curr = curr.parent;
        }
        rawPath.reverse();
      }

      if (rawPath.length < 3) return;

      // Greedy Ray-Casting Shortcutting
      const smoothed = [rawPath[0]];
      let currentIdx = 0;

      while (currentIdx < rawPath.length - 1) {
        let furthestVisible = currentIdx + 1;
        for (let j = rawPath.length - 1; j > currentIdx + 1; j--) {
          if (!isSegmentColliding(rawPath[currentIdx], rawPath[j])) {
            furthestVisible = j;
            break;
          }
        }
        smoothed.push(rawPath[furthestVisible]);
        currentIdx = furthestVisible;
      }

      shortcutPath = smoothed;

      // Calculate new cost
      let cost = 0;
      for (let i = 0; i < shortcutPath.length - 1; i++) {
        cost += dist(shortcutPath[i], shortcutPath[i + 1]);
      }
      document.getElementById('statCost').textContent = cost.toFixed(1) + ' (сглажен!)';
      draw();
    }

    function updateStats() {
      const totalNodes = nodes.length + nodesB.length - 1;
      document.getElementById('statNodes').textContent = totalNodes;
      document.getElementById('statIter').textContent = iterations;
      const c = getBestCost();
      const algo = document.getElementById('algoSelect').value;
      let costStr = '-';
      if (c < Infinity) {
        costStr = c.toFixed(1);
        if (algo === 'informed-rrt-star') {
          costStr += ' (эллипс C_best)';
        }
      }
      document.getElementById('statCost').textContent = costStr;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Subtle grid
      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 1;
      const stepGrid = 40;
      for (let x = 0; x < width; x += stepGrid) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += stepGrid) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Draw obstacles
      ctx.fillStyle = '#cbd5e1';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      for (const obs of obstacles) {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      if (isDrawingObstacle && newObsStart) {
        ctx.beginPath();
        ctx.arc(newObsStart.x, newObsStart.y, newObsStart.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.fill();
        ctx.strokeStyle = '#64748b';
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Informed RRT* ellipse if active and path found
      const algo = document.getElementById('algoSelect').value;
      const cBest = getBestCost();
      const cMin = dist(start, goal);
      if (algo === 'informed-rrt-star' && cBest < Infinity && cBest >= cMin) {
        const a = cBest / 2;
        const b = Math.sqrt(Math.max(1, cBest * cBest - cMin * cMin)) / 2;
        const cx = (start.x + goal.x) / 2;
        const cy = (start.y + goal.y) / 2;
        const angle = Math.atan2(goal.y - start.y, goal.x - start.x);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, a, b, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.07)';
        ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.stroke();

        // Label on ellipse boundary
        ctx.setLineDash([]);
        ctx.fillStyle = '#059669';
        ctx.font = '600 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Эллипсоид C_best = ${cBest.toFixed(1)}`, 0, -b - 6);

        ctx.restore();
      }

      // Draw Tree A (Blue)
      ctx.strokeStyle = 'rgba(2, 132, 199, 0.4)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 1; i < nodes.length; i++) {
        const n = nodes[i];
        if (n.parent) {
          ctx.moveTo(n.parent.x, n.parent.y);
          ctx.lineTo(n.x, n.y);
        }
      }
      ctx.stroke();

      ctx.fillStyle = '#0284c7';
      for (let i = 0; i < nodes.length; i++) {
        ctx.fillRect(nodes[i].x - 1, nodes[i].y - 1, 2.5, 2.5);
      }

      // Draw Tree B (Purple) for RRT-Connect
      if (algo === 'rrt-connect' && nodesB.length > 1) {
        ctx.strokeStyle = 'rgba(147, 51, 234, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 1; i < nodesB.length; i++) {
          const n = nodesB[i];
          if (n.parent) {
            ctx.moveTo(n.parent.x, n.parent.y);
            ctx.lineTo(n.x, n.y);
          }
        }
        ctx.stroke();

        ctx.fillStyle = '#9333ea';
        for (let i = 0; i < nodesB.length; i++) {
          ctx.fillRect(nodesB[i].x - 1, nodesB[i].y - 1, 2.5, 2.5);
        }
      }

      // Draw last sample
      if (lastSample) {
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 1.5;
        const size = 5;
        ctx.beginPath();
        ctx.moveTo(lastSample.x - size, lastSample.y);
        ctx.lineTo(lastSample.x + size, lastSample.y);
        ctx.moveTo(lastSample.x, lastSample.y - size);
        ctx.lineTo(lastSample.x, lastSample.y + size);
        ctx.stroke();
      }

      // Draw Raw Path
      if (algo === 'rrt-connect' && connectMeetingNodes) {
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        let ca = connectMeetingNodes.a;
        ctx.moveTo(ca.x, ca.y);
        while (ca) { ctx.lineTo(ca.x, ca.y); ca = ca.parent; }
        ctx.stroke();

        ctx.strokeStyle = '#9333ea';
        ctx.beginPath();
        let cb = connectMeetingNodes.b;
        ctx.moveTo(connectMeetingNodes.a.x, connectMeetingNodes.a.y);
        while (cb) { ctx.lineTo(cb.x, cb.y); cb = cb.parent; }
        ctx.stroke();
      } else if (pathFoundNode) {
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(goal.x, goal.y);
        let curr = pathFoundNode;
        while (curr) {
          ctx.lineTo(curr.x, curr.y);
          curr = curr.parent;
        }
        ctx.stroke();
      }

      // Draw Shortcut Path if computed
      if (shortcutPath && shortcutPath.length > 1) {
        ctx.strokeStyle = '#059669';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(shortcutPath[0].x, shortcutPath[0].y);
        for (let i = 1; i < shortcutPath.length; i++) {
          ctx.lineTo(shortcutPath[i].x, shortcutPath[i].y);
        }
        ctx.stroke();

        for (const pt of shortcutPath) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#059669';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      // Draw Goal Region
      ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Start & Goal Markers
      function drawMarker(pt, col, label) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, pt.x, pt.y);
      }

      drawMarker(start, '#10b981', 'S');
      drawMarker(goal, '#f59e0b', 'G');
    }

    function loop() {
      if (!isRunning) return;
      for (let k = 0; k < 3; k++) {
        step();
      }
      animFrame = requestAnimationFrame(loop);
    }

    document.getElementById('btnStep').addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        document.getElementById('btnRun').textContent = '⚡ Запуск';
      }
      step();
    });

    document.getElementById('btnRun').addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        document.getElementById('btnRun').textContent = '⚡ Запуск';
        document.getElementById('btnRun').className = 'btn btn-primary';
      } else {
        isRunning = true;
        document.getElementById('btnRun').textContent = '⏸ Пауза';
        document.getElementById('btnRun').className = 'btn btn-success';
        loop();
      }
    });

    document.getElementById('btnShortcut').addEventListener('click', runShortcut);
    document.getElementById('btnReset').addEventListener('click', resetTree);
    document.getElementById('btnClearObs').addEventListener('click', () => {
      obstacles = [];
      resetTree();
    });
    document.getElementById('algoSelect').addEventListener('change', resetTree);

    // Mouse handlers
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      if (start && dist(pt, start) <= 15) {
        draggingPoint = 'start';
        return;
      }
      if (goal && dist(pt, goal) <= 15) {
        draggingPoint = 'goal';
        return;
      }

      isDrawingObstacle = true;
      newObsStart = { x: pt.x, y: pt.y, r: 5 };
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      if (draggingPoint === 'start') {
        start.x = Math.max(10, Math.min(width - 10, pt.x));
        start.y = Math.max(10, Math.min(height - 10, pt.y));
        resetTree();
        return;
      }
      if (draggingPoint === 'goal') {
        goal.x = Math.max(10, Math.min(width - 10, pt.x));
        goal.y = Math.max(10, Math.min(height - 10, pt.y));
        resetTree();
        return;
      }

      if (isDrawingObstacle && newObsStart) {
        newObsStart.r = Math.max(10, dist(newObsStart, pt));
        draw();
      }
    });

    window.addEventListener('mouseup', () => {
      if (draggingPoint) draggingPoint = null;
      if (isDrawingObstacle && newObsStart) {
        if (newObsStart.r >= 12) {
          obstacles.push({ x: newObsStart.x, y: newObsStart.y, r: newObsStart.r });
          resetTree();
        }
        isDrawingObstacle = false;
        newObsStart = null;
        draw();
      }
    });

    // Check URL hash on load
    function checkHash() {
      const hash = window.location.hash.toLowerCase();
      const sel = document.getElementById('algoSelect');
      if (hash.includes('connect')) {
        sel.value = 'rrt-connect';
      } else if (hash.includes('informed')) {
        sel.value = 'informed-rrt-star';
      } else if (hash.includes('star')) {
        sel.value = 'rrt-star';
      } else if (hash.includes('rrt')) {
        sel.value = 'rrt';
      }
    }

    window.addEventListener('hashchange', () => {
      checkHash();
      resetTree();
    });

    checkHash();
    resetTree();
  </script>
</body>
</html>
