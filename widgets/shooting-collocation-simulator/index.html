<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Одиночная и многократная стрельба, коллокация</title>
<link rel="stylesheet" href="../common/widget-base.css">
<style>
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 8px; padding: 8px; }
  .panel { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; min-height: 0; }
  .ptitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .cv { flex: 1; min-height: 0; position: relative; }
  .right { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .seg { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 5px 10px; font-size: 12px; cursor: pointer; color: #334155; border-right: 1px solid #e2e8f0; }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: #e0f2fe; color: #0369a1; font-weight: 700; }
  table.log { width: 100%; border-collapse: collapse; font-size: 11.5px; font-family: var(--font-mono); }
  table.log th, table.log td { padding: 2px 6px; border-bottom: 1px solid #eef2f7; text-align: right; }
  table.log th { font-family: var(--font-sans); color: var(--text-muted); font-weight: 600; position: sticky; top: 0; background: #fff; }
  .logbox { flex: 1; min-height: 0; overflow-y: auto; }
  .note { font-size: 12px; line-height: 1.38; color: #1e293b; background: #f0f9ff; border-left: 3px solid #0284c7; padding: 6px 9px; border-radius: 4px; }
  .note b { color: #0c4a6e; }
  .status { font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: #475569; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<div class="widget-layout">
  <div class="toolbar">
    <b style="color: var(--accent-blue);">Задача:</b>
    <select id="problem" class="select-control">
      <option value="cart">1. Тележка (линейная модель)</option>
      <option value="swing">2. Маятник: подъём из нижнего положения</option>
      <option value="unstable">3. Неустойчивая система: перевёрнутый маятник</option>
    </select>
    <div class="seg" id="methods">
      <button data-m="single">Одиночная стрельба</button>
      <button data-m="multi">Многократная стрельба</button>
      <button data-m="colloc">Коллокация</button>
    </div>
    <select id="init" class="select-control">
      <option value="zero">Приближение: u = 0, узлы в старте</option>
      <option value="linear">Приближение: узлы на прямой старт–цель</option>
    </select>
    <button id="step" class="btn btn-primary">Одна итерация</button>
    <button id="run" class="btn">До решения</button>
    <button id="reset" class="btn">Сначала</button>
  </div>
  <div class="main">
    <div class="panel">
      <div class="ptitle"><span id="ytitle">Положение x₁(t)</span><span class="status" id="status"></span></div>
      <div class="cv" style="flex: 1.6;"><canvas id="traj"></canvas></div>
      <div class="ptitle" style="margin-top: 4px;"><span>Управление u(t)</span></div>
      <div class="cv" style="flex: 0.8;"><canvas id="ctrl"></canvas></div>
      <div class="legend">
        <span><i style="background:#0284c7"></i>движение по модели</span>
        <span><i style="background:#0f172a"></i>узлы (переменные решателя)</span>
        <span><i style="background:#dc2626"></i>дефект / промах</span>
        <span><i style="background:#059669"></i>старт и цель</span>
      </div>
    </div>
    <div class="right">
      <div class="panel" style="flex: 1;">
        <div class="ptitle"><span>Итерации решателя (SQP)</span><span id="nvars"></span></div>
        <div class="logbox">
          <table class="log"><thead><tr><th>№</th><th>критерий J</th><th id="defh">наибольший дефект</th><th>шаг α</th></tr></thead><tbody id="log"></tbody></table>
        </div>
      </div>
      <div class="panel" style="flex: 0 0 auto;">
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>
</div>
<script>
// ---------------------------------------------------------------------------
// Прямая транскрипция задачи: min ∫u² dt, x(0) = x0, x(T) = xT, N интервалов.
// Решатель — SQP для задачи с равенствами: в каждой итерации решается система
// ККТ с точным гессианом критерия и якобианом ограничений (конечные разности),
// шаг принимается с поиском по прямой для штрафной функции J + μ·Σ|c|.
// ---------------------------------------------------------------------------
const PROBLEMS = {
  cart: { f: (x, u) => [x[1], u], x0: [0, 0], xT: [1, 0], T: 2, label: 'Положение x₁(t), м', yr: [-0.3, 1.3] },
  swing: { f: (x, u) => [x[1], -Math.sin(x[0]) - 0.1 * x[1] + u], x0: [0, 0], xT: [Math.PI, 0], T: 4, label: 'Угол маятника θ(t), рад (π — верхнее положение)', yr: [-1, 4.2] },
  unstable: { f: (x, u) => [x[1], 4 * Math.sin(x[0]) + u], x0: [-1, 0], xT: [1, 0], T: 4, label: 'Угол θ(t), рад (0 — неустойчивое верхнее положение)', yr: [-2.5, 2.5] },
};
const NOTES = {
  'cart-single': '<b>Что наблюдать.</b> Переменные — только 20 значений управления. При u = 0 тележка стоит, и промах по положению равен 1 м. Модель линейна, а критерий квадратичен, поэтому <b>одна итерация</b> находит точное решение: промах сразу падает до ошибки округления.',
  'cart-multi': '<b>Что наблюдать.</b> Переменные — 21 узел по 2 числа и 20 управлений, всего 62 числа. Каждый интервал моделируется от своего узла; красные отрезки — дефекты. Для линейной задачи одна итерация убирает все дефекты сразу. Попробуйте приближение «узлы на прямой»: дефекты малы уже в начале.',
  'cart-colloc': '<b>Что наблюдать.</b> Интегрирования нет: дефект — невыполнение формулы трапеций между соседними узлами. Задача линейна, и одна итерация снова даёт решение. Затраты немного отличаются от стрельбы: управление здесь кусочно-линейное.',
  'swing-single': '<b>Что наблюдать.</b> Нужно поднять маятник из нижнего положения (θ = 0) в верхнее (θ = π) за 4 с. При u = 0 маятник висит, промах равен π. Решатель «прицеливается» по промаху: нужно 11 итераций, и первые четыре — с укороченным шагом α = 0.5, потому что полный шаг слишком сильно меняет конец траектории.',
  'swing-multi': '<b>Что наблюдать.</b> С приближением «узлы на прямой» угол в узлах сразу растёт от 0 до π, дефекты малы с самого начала, и решение находится за 5 итераций (у одиночной стрельбы — 11). С приближением «u = 0» нужно 9 итераций: подсказка о форме пути и есть главное преимущество.',
  'swing-colloc': '<b>Что наблюдать.</b> Коллокация с узлами на прямой: решение за 3 итерации. По форме оно совпадает с многократной стрельбой; затраты J чуть отличаются, потому что управление здесь кусочно-линейное, а формула трапеций менее точна, чем RK4.',
  'unstable-single': '<b>Что наблюдать.</b> Система неустойчива: маятник падает с вершины, и малое изменение первых управлений сильно меняет конец траектории. Одиночная стрельба делает 43 итерации, часто с укороченным шагом α, и приходит к решению с <b>большими затратами</b> J = 36.2 — к другому, худшему локальному минимуму.',
  'unstable-multi': '<b>Что наблюдать.</b> Каждый интервал короткий, и ошибки не успевают вырасти: решение за 3 итерации с полным шагом α = 1 и с затратами J = 27.0 — на четверть меньше, чем у одиночной стрельбы. Это главная причина популярности многократной стрельбы.',
  'unstable-colloc': '<b>Что наблюдать.</b> Коллокация так же хорошо справляется с неустойчивой системой, как многократная стрельба: решение за 2 итерации, J = 27.3 (небольшое отличие — из-за формулы трапеций).',
};
const DEFAULTS = { cart: ['single', 'zero'], swing: ['single', 'zero'], unstable: ['single', 'zero'] };
const N = 20, NX = 2, SUB = 4;
let P, method, init, w, logRows, done, h;

const $ = id => document.getElementById(id);

function rk4(f, x, u, dt) {
  const k1 = f(x, u);
  const k2 = f([x[0] + dt / 2 * k1[0], x[1] + dt / 2 * k1[1]], u);
  const k3 = f([x[0] + dt / 2 * k2[0], x[1] + dt / 2 * k2[1]], u);
  const k4 = f([x[0] + dt * k3[0], x[1] + dt * k3[1]], u);
  return [x[0] + dt / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), x[1] + dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])];
}
function Fint(x, u) { for (let i = 0; i < SUB; i++) x = rk4(P.f, x, u, h / SUB); return x; }

// ----- раскладка переменных
const nU = () => method === 'colloc' ? N + 1 : N;
const nW = () => method === 'single' ? N : (N + 1) * NX + nU();
const Xk = (w, k) => [w[k * NX], w[k * NX + 1]];
const Uk = (w, k) => method === 'single' ? w[k] : w[(N + 1) * NX + k];

function simulateSingle(w) {
  const xs = [P.x0.slice()]; let x = P.x0.slice();
  for (let k = 0; k < N; k++) { x = Fint(x, w[k]); xs.push(x); }
  return xs;
}
function cons(w) {
  if (method === 'single') { const xs = simulateSingle(w); return [xs[N][0] - P.xT[0], xs[N][1] - P.xT[1]]; }
  const c = [];
  const x0 = Xk(w, 0); c.push(x0[0] - P.x0[0], x0[1] - P.x0[1]);
  for (let k = 0; k < N; k++) {
    const xa = Xk(w, k), xb = Xk(w, k + 1);
    let pred;
    if (method === 'multi') pred = Fint(xa, Uk(w, k));
    else { const fa = P.f(xa, Uk(w, k)), fb = P.f(xb, Uk(w, k + 1)); pred = [xa[0] + h / 2 * (fa[0] + fb[0]), xa[1] + h / 2 * (fa[1] + fb[1])]; }
    c.push(xb[0] - pred[0], xb[1] - pred[1]);
  }
  const xN = Xk(w, N); c.push(xN[0] - P.xT[0], xN[1] - P.xT[1]);
  return c;
}
function cost(w) {
  let J = 0;
  if (method === 'colloc') for (let k = 0; k < N; k++) J += h * (Uk(w, k) ** 2 + Uk(w, k + 1) ** 2) / 2;
  else for (let k = 0; k < N; k++) J += h * Uk(w, k) ** 2;
  return J;
}
function gradHess(w) {
  const n = nW(), g = new Array(n).fill(0), H = Array.from({ length: n }, () => new Array(n).fill(0));
  const off = method === 'single' ? 0 : (N + 1) * NX;
  if (method === 'colloc') {
    for (let k = 0; k <= N; k++) { const wt = (k === 0 || k === N) ? h : 2 * h; g[off + k] = wt * Uk(w, k); H[off + k][off + k] = wt; }
  } else {
    for (let k = 0; k < N; k++) { g[off + k] = 2 * h * Uk(w, k); H[off + k][off + k] = 2 * h; }
  }
  for (let i = 0; i < off; i++) H[i][i] = 1e-6;
  return [g, H];
}
function jac(w) {
  const c0 = cons(w), n = w.length, J = Array.from({ length: c0.length }, () => new Array(n).fill(0)), e = 1e-6;
  for (let i = 0; i < n; i++) { const w2 = w.slice(); w2[i] += e; const c2 = cons(w2); for (let j = 0; j < c0.length; j++) J[j][i] = (c2[j] - c0[j]) / e; }
  return J;
}
function solveLin(A, b) {
  const n = b.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c] || 1e-12;
    for (let r = c + 1; r < n; r++) { const f = M[r][c] / d; if (f !== 0) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  const x = new Array(n).fill(0);
  for (let r = n - 1; r >= 0; r--) { let s = M[r][n]; for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k]; x[r] = s / (M[r][r] || 1e-12); }
  return x;
}
const maxAbs = a => a.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
const sumAbs = a => a.reduce((m, v) => m + Math.abs(v), 0);

function sqpStep() {
  if (done) return;
  const c = cons(w), [g, H] = gradHess(w), J = jac(w);
  const n = w.length, m = c.length;
  const K = Array.from({ length: n + m }, () => new Array(n + m).fill(0));
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) K[i][j] = H[i][j];
  for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) { K[n + i][j] = J[i][j]; K[j][n + i] = J[i][j]; }
  for (let i = 0; i < m; i++) K[n + i][n + i] = -1e-10;
  const sol = solveLin(K, [...g.map(v => -v), ...c.map(v => -v)]);
  const dw = sol.slice(0, n), lam = sol.slice(n);
  const mu = 1.5 * maxAbs(lam) + 1;
  const phi = ww => cost(ww) + mu * sumAbs(cons(ww));
  const p0 = phi(w); let D = 0; for (let i = 0; i < n; i++) D += g[i] * dw[i]; D -= mu * sumAbs(c);
  let a = 1;
  while (a > 1e-4 && phi(w.map((v, i) => v + a * dw[i])) > p0 + 1e-4 * a * D) a *= 0.5;
  const wN = w.map((v, i) => v + a * dw[i]);
  const cN = cons(wN), JN = cost(wN), Jold = logRows[logRows.length - 1][1];
  // шаг пренебрежимо мал: текущая точка уже удовлетворяет условиям ККТ
  if (maxAbs(dw) * a < 1e-6 || (maxAbs(c) < 1e-7 && maxAbs(cN) < 1e-7 && Math.abs(JN - Jold) < 1e-7 * (1 + JN))) { done = true; return; }
  w = wN;
  logRows.push([logRows.length, JN, maxAbs(cN), a]);
  if (logRows.length > 80) done = true;
}

function reset() {
  P = PROBLEMS[$('problem').value];
  h = P.T / N;
  w = new Array(nW()).fill(0);
  if (method !== 'single') {
    for (let k = 0; k <= N; k++) {
      const s = init === 'linear' ? k / N : 0;
      w[k * NX] = P.x0[0] + (P.xT[0] - P.x0[0]) * s;
      w[k * NX + 1] = P.x0[1] + (P.xT[1] - P.x0[1]) * s;
    }
  }
  logRows = [[0, cost(w), maxAbs(cons(w)), null]];
  done = false;
  $('ytitle').textContent = P.label;
  $('nvars').textContent = `переменных: ${nW()}, ограничений: ${cons(w).length}`;
  $('note').innerHTML = NOTES[$('problem').value + '-' + method];
  $('init').disabled = method === 'single';
  $('defh').textContent = method === 'single' ? 'промах в конце' : 'наибольший дефект';
  document.querySelectorAll('#methods button').forEach(b => b.classList.toggle('on', b.dataset.m === method));
  render();
}

// ---------------------------------------------------------------- рисование
function fit(cv) {
  const r = cv.parentElement.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.max(10, r.width * d); cv.height = Math.max(10, r.height * d);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0); return [ctx, r.width, r.height];
}
function frame(ctx, W, H, yr, xlab) {
  const box = [44, 6, W - 54, H - 28];
  const px = t => box[0] + t / P.T * box[2];
  const py = y => box[1] + box[3] - (y - yr[0]) / (yr[1] - yr[0]) * box[3];
  ctx.fillStyle = '#fff'; ctx.fillRect(...box);
  ctx.strokeStyle = '#eef2f7'; ctx.fillStyle = '#64748b'; ctx.font = '10.5px Inter, sans-serif'; ctx.lineWidth = 1;
  ctx.textAlign = 'center';
  for (let t = 0; t <= P.T + 1e-9; t += P.T / 4) { ctx.beginPath(); ctx.moveTo(px(t), box[1]); ctx.lineTo(px(t), box[1] + box[3]); ctx.stroke(); ctx.fillText(t.toFixed(0), px(t), box[1] + box[3] + 12); }
  ctx.textAlign = 'right';
  const span = yr[1] - yr[0], st = span > 6 ? 2 : span > 3 ? 1 : 0.5;
  for (let y = Math.ceil(yr[0] / st) * st; y <= yr[1]; y += st) { ctx.beginPath(); ctx.moveTo(box[0], py(y)); ctx.lineTo(box[0] + box[2], py(y)); ctx.stroke(); ctx.fillText(+y.toFixed(2), box[0] - 4, py(y) + 3); }
  ctx.strokeStyle = '#94a3b8'; if (yr[0] < 0 && yr[1] > 0) { ctx.beginPath(); ctx.moveTo(box[0], py(0)); ctx.lineTo(box[0] + box[2], py(0)); ctx.stroke(); }
  ctx.strokeStyle = '#cbd5e1'; ctx.strokeRect(...box);
  if (xlab) { ctx.fillStyle = '#334155'; ctx.font = 'italic 11px Inter, sans-serif'; ctx.textAlign = 'right'; ctx.fillText(xlab, box[0] + box[2], box[1] + box[3] + 24); }
  return [px, py, box];
}

function render() {
  // траектория
  let [ctx, W, H] = fit($('traj'));
  ctx.clearRect(0, 0, W, H);
  let lo = P.yr[0], hi = P.yr[1];
  const segs = [];
  if (method === 'single') {
    const pts = []; let x = P.x0.slice(); pts.push([0, x[0]]);
    for (let k = 0; k < N; k++) for (let i = 0; i < SUB; i++) { x = rk4(P.f, x, w[k], h / SUB); pts.push([(k + (i + 1) / SUB) * h, x[0]]); }
    segs.push(pts);
  } else {
    for (let k = 0; k < N; k++) {
      const pts = []; let x = Xk(w, k); pts.push([k * h, x[0]]);
      if (method === 'multi') { for (let i = 0; i < SUB; i++) { x = rk4(P.f, x, Uk(w, k), h / SUB); pts.push([(k + (i + 1) / SUB) * h, x[0]]); } }
      else { const fa = P.f(Xk(w, k), Uk(w, k)), fb = P.f(Xk(w, k + 1), Uk(w, k + 1)); pts.push([(k + 1) * h, x[0] + h / 2 * (fa[0] + fb[0])]); }
      segs.push(pts);
    }
  }
  for (const s of segs) for (const p of s) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }
  if (method !== 'single') for (let k = 0; k <= N; k++) { lo = Math.min(lo, w[k * NX]); hi = Math.max(hi, w[k * NX]); }
  lo = Math.max(lo, -12); hi = Math.min(hi, 12);
  const [px, py, box] = frame(ctx, W, H, [lo, hi], 't, с');
  ctx.save(); ctx.beginPath(); ctx.rect(...box); ctx.clip();
  ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 2.2;
  for (const s of segs) { ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(px(p[0]), py(p[1])) : ctx.moveTo(px(p[0]), py(p[1]))); ctx.stroke(); }
  ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2.6;
  if (method === 'single') {
    const end = segs[0][segs[0].length - 1];
    ctx.beginPath(); ctx.moveTo(px(P.T) - 3, py(end[1])); ctx.lineTo(px(P.T) - 3, py(P.xT[0])); ctx.stroke();
  } else {
    for (let k = 0; k < N; k++) { const e = segs[k][segs[k].length - 1]; ctx.beginPath(); ctx.moveTo(px(e[0]), py(e[1])); ctx.lineTo(px(e[0]), py(w[(k + 1) * NX])); ctx.stroke(); }
    ctx.fillStyle = '#0f172a';
    for (let k = 0; k <= N; k++) { ctx.beginPath(); ctx.arc(px(k * h), py(w[k * NX]), 3.2, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = '#059669';
  for (const [t, y] of [[0, P.x0[0]], [P.T, P.xT[0]]]) { ctx.beginPath(); ctx.arc(px(t), py(y), 6, 0, 7); ctx.fill(); }
  ctx.restore();
  // управление
  [ctx, W, H] = fit($('ctrl'));
  ctx.clearRect(0, 0, W, H);
  let um = 1; for (let k = 0; k < nU(); k++) um = Math.max(um, Math.abs(Uk(w, k)));
  um = Math.min(um * 1.15, 50);
  const [qx, qy, qb] = frame(ctx, W, H, [-um, um], '');
  ctx.save(); ctx.beginPath(); ctx.rect(...qb); ctx.clip();
  ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 2; ctx.beginPath();
  if (method === 'colloc') { for (let k = 0; k <= N; k++) { const X = qx(k * h), Y = qy(Uk(w, k)); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } }
  else { for (let k = 0; k < N; k++) { const Y = qy(Uk(w, k)); k ? ctx.lineTo(qx(k * h), Y) : ctx.moveTo(qx(0), Y); ctx.lineTo(qx((k + 1) * h), Y); } }
  ctx.stroke(); ctx.restore();
  // журнал
  $('log').innerHTML = logRows.map(r => `<tr><td>${r[0]}</td><td>${r[1].toFixed(3)}</td><td>${r[2] < 1e-4 ? r[2].toExponential(1) : r[2].toFixed(4)}</td><td>${r[3] === null ? '—' : r[3] < 1 ? r[3].toFixed(3) : '1'}</td></tr>`).join('');
  const lb = document.querySelector('.logbox'); lb.scrollTop = lb.scrollHeight;
  const last = logRows[logRows.length - 1];
  $('status').textContent = done ? `решено за ${logRows.length - 1} итераций` : `итерация ${logRows.length - 1}`;
  $('status').style.color = done ? '#059669' : '#475569';
}

$('step').addEventListener('click', () => { sqpStep(); render(); });
$('run').addEventListener('click', () => {
  const go = () => { if (done) return; sqpStep(); render(); setTimeout(go, 120); };
  go();
});
$('reset').addEventListener('click', reset);
$('problem').addEventListener('change', () => { [method, init] = DEFAULTS[$('problem').value]; $('init').value = init; reset(); });
$('init').addEventListener('change', () => { init = $('init').value; reset(); });
document.querySelectorAll('#methods button').forEach(b => b.addEventListener('click', () => {
  method = b.dataset.m;
  if (method !== 'single' && init === 'zero' && $('problem').value !== 'cart') { init = 'linear'; $('init').value = 'linear'; }
  reset();
}));
window.addEventListener('resize', render);

const q = new URLSearchParams(location.search);
const sc = q.get('scenario');
const map = { '1': ['cart', 'single', 'zero'], '2': ['swing', 'single', 'zero'], '3': ['swing', 'multi', 'linear'], '4': ['unstable', 'single', 'zero'], '5': ['unstable', 'multi', 'linear'], '6': ['unstable', 'colloc', 'linear'] };
const pick = map[sc] || map['1'];
$('problem').value = pick[0]; method = pick[1]; init = pick[2]; $('init').value = init;
reset();
</script>
</body>
